<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>⚡ League Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{
  --bg:#0b0d17;--bg2:#15192b;--panel:rgba(21,25,43,.72);--panel2:rgba(11,13,23,.85);
  --cyan:#00f0ff;--magenta:#ff2bd6;--lime:#8bff3c;--gold:#ffd53d;--red:#ff4d6d;
  --txt:#e8ecff;--dim:#8892b0;--line:rgba(0,240,255,.22);--line2:rgba(255,43,214,.22);--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Segoe UI',Roboto,system-ui,-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:-35%;z-index:-2;background:radial-gradient(circle at 18% 18%,rgba(0,240,255,.20),transparent 45%),radial-gradient(circle at 82% 25%,rgba(255,43,214,.18),transparent 45%),radial-gradient(circle at 50% 88%,rgba(139,255,60,.10),transparent 45%);animation:bgmove 20s ease-in-out infinite alternate;filter:blur(30px);pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%)}
@keyframes bgmove{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-3%,0) scale(1.08)}100%{transform:translate3d(-3%,2%,0) scale(1.04)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0b0d17}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--magenta));border-radius:10px}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(11,13,23,.96),rgba(11,13,23,.72));border-bottom:1px solid var(--line);box-shadow:0 0 30px rgba(0,240,255,.10)}
.brandbar{display:flex;align-items:center;gap:12px;padding:12px 16px 6px;flex-wrap:wrap}
.brand{font-weight:900;font-size:20px;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(0,240,255,.55));cursor:pointer;user-select:none;white-space:nowrap}
.brand .ball{display:inline-block;animation:spinball 6s linear infinite;filter:none;-webkit-text-fill-color:initial;color:var(--gold)}
@keyframes spinball{to{transform:rotate(360deg)}}
.season-chip{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);padding:4px 10px;border-radius:999px;background:rgba(0,240,255,.05)}
.spacer{flex:1}
.cloud-badge{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.cloud-badge.on{color:var(--lime);border-color:rgba(139,255,60,.5);box-shadow:0 0 12px rgba(139,255,60,.25)}
.cloud-badge.off{color:var(--gold);border-color:rgba(255,213,61,.4)}
nav.nav{display:flex;gap:8px;padding:8px 14px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.nav::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;cursor:pointer;border:1px solid var(--line);background:rgba(0,240,255,.045);color:var(--txt);padding:8px 13px;font-size:11.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:all .18s ease;white-space:nowrap;display:flex;align-items:center;gap:6px}
.navbtn:hover{background:rgba(0,240,255,.16);box-shadow:0 0 18px rgba(0,240,255,.35);transform:translateY(-1px)}
.navbtn:active{transform:scale(.95)}
.navbtn.active{background:linear-gradient(135deg,rgba(0,240,255,.28),rgba(255,43,214,.28));border-color:var(--cyan);color:#fff;box-shadow:0 0 22px rgba(0,240,255,.5),inset 0 0 18px rgba(255,43,214,.18)}
.navbtn.ghost{border-color:var(--line2);background:rgba(255,43,214,.07)}
.navbtn.admin{border-color:rgba(255,213,61,.45);background:rgba(255,213,61,.08)}
h2,h3,h4{text-transform:uppercase;letter-spacing:2px;margin:0}
.view-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 4px 14px;margin-bottom:6px}
.view-head h2{font-size:19px;color:#fff;text-shadow:0 0 16px rgba(0,240,255,.6)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.section-title{font-size:12.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--cyan);margin:22px 0 10px;display:flex;align-items:center;gap:9px;text-shadow:0 0 12px rgba(0,240,255,.45)}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.muted{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}.center{text-align:center}.nowrap{white-space:nowrap}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(0,240,255,.07);color:var(--txt);padding:9px 15px;font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:all .16s ease;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.btn:hover{background:rgba(0,240,255,.2);box-shadow:0 0 20px rgba(0,240,255,.4);transform:translateY(-1px)}
.btn:active{transform:scale(.94)}
.btn.magenta{border-color:var(--line2);background:rgba(255,43,214,.1)}.btn.magenta:hover{background:rgba(255,43,214,.24);box-shadow:0 0 20px rgba(255,43,214,.45)}
.btn.gold{border-color:rgba(255,213,61,.5);background:rgba(255,213,61,.1)}.btn.gold:hover{background:rgba(255,213,61,.25);box-shadow:0 0 20px rgba(255,213,61,.4)}
.btn.danger{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.1)}.btn.danger:hover{background:rgba(255,77,109,.28);box-shadow:0 0 20px rgba(255,77,109,.4)}
.btn.lime{border-color:rgba(139,255,60,.5);background:rgba(139,255,60,.09)}.btn.lime:hover{background:rgba(139,255,60,.24);box-shadow:0 0 20px rgba(139,255,60,.4)}
.btn.sm{padding:6px 10px;font-size:10px;letter-spacing:1px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);transition:all .2s ease;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--magenta),transparent);opacity:.7}
.card:hover{border-color:rgba(0,240,255,.5);box-shadow:0 0 26px rgba(0,240,255,.18);transform:translateY(-2px)}
.card.clickable{cursor:pointer}
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tdot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 10px currentColor;flex:0 0 auto}
.tlogo{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:26px;height:26px;border-radius:8px;overflow:hidden;line-height:1;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);font-size:14px;font-weight:900;box-shadow:inset 0 0 12px rgba(255,255,255,.04),0 0 12px rgba(0,240,255,.10)}
.tlogo img{width:100%;height:100%;object-fit:cover;display:block}
.tlogo.lg{border-radius:15px;box-shadow:inset 0 0 16px rgba(255,255,255,.05),0 0 26px rgba(0,240,255,.22)}
.tlogo.sm{width:20px;height:20px;font-size:11px;border-radius:6px}
.cl-name{cursor:pointer;transition:color .15s ease,text-shadow .15s ease,border-color .15s ease;border-bottom:1px dotted transparent}
.cl-name:hover{color:var(--cyan);border-bottom-color:rgba(0,240,255,.45);text-shadow:0 0 12px rgba(0,240,255,.5)}
.itag{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;max-width:100%}
.itag>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade-tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:linear-gradient(160deg,rgba(0,240,255,.06),rgba(255,43,214,.03));transition:all .2s ease}
.grade-tile:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(0,240,255,.18)}
.grade-tile h4{font-size:12.5px;letter-spacing:2px;display:flex;align-items:center;gap:8px;margin-bottom:9px;color:#fff}
.grade-tile ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.9;color:var(--dim)}
.grade-tile .gc-note{font-size:12.5px;color:var(--dim);line-height:1.7}
.grade-tile.gS{border-color:rgba(255,213,61,.45)}.grade-tile.gA{border-color:rgba(0,240,255,.45)}.grade-tile.gB{border-color:rgba(139,255,60,.4)}.grade-tile.gC{border-color:rgba(255,255,255,.14)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);background:rgba(11,13,23,.55)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th{text-align:left;padding:10px 10px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);background:rgba(0,240,255,.06);position:sticky;top:0;white-space:nowrap;z-index:2;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
tbody tr{transition:background .15s}tbody tr:hover{background-color:rgba(0,240,255,.07)}tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:900;letter-spacing:1px}
.b-W{background:rgba(139,255,60,.16);color:var(--lime);border:1px solid rgba(139,255,60,.45);box-shadow:0 0 9px rgba(139,255,60,.25)}
.b-D{background:rgba(255,213,61,.14);color:var(--gold);border:1px solid rgba(255,213,61,.4)}
.b-L{background:rgba(255,77,109,.14);color:var(--red);border:1px solid rgba(255,77,109,.4)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-weight:900;font-size:12px}
.rk-S{background:linear-gradient(135deg,#ffd53d,#ff9d00);color:#1a1200;box-shadow:0 0 14px rgba(255,213,61,.7)}
.rk-A{background:linear-gradient(135deg,#00f0ff,#0095ff);color:#001a1f;box-shadow:0 0 12px rgba(0,240,255,.6)}
.rk-B{background:linear-gradient(135deg,#8bff3c,#38c400);color:#0b1a00;box-shadow:0 0 12px rgba(139,255,60,.5)}
.rk-C{background:linear-gradient(135deg,#8892b0,#4b5570);color:#fff}
.rk-D{background:rgba(255,255,255,.08);color:var(--dim)}
.rank1{background:linear-gradient(135deg,#ffd53d,#ff8a00);color:#1a1200;box-shadow:0 0 14px rgba(255,213,61,.75)}
.rank2{background:linear-gradient(135deg,#dfe7ff,#8d9bbd);color:#0b0d17;box-shadow:0 0 12px rgba(220,230,255,.5)}
.rank3{background:linear-gradient(135deg,#ff9d5c,#b35a1f);color:#1a0d00;box-shadow:0 0 12px rgba(255,157,92,.5)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--line);color:var(--dim);background:rgba(0,240,255,.05)}
.pill.cy{color:var(--cyan);border-color:rgba(0,240,255,.45)}
.pill.mg{color:var(--magenta);border-color:rgba(255,43,214,.45)}
.pill.li{color:var(--lime);border-color:rgba(139,255,60,.45)}
.pill.go{color:var(--gold);border-color:rgba(255,213,61,.45)}
.bar{height:22px;border-radius:6px;position:relative;overflow:hidden;background:rgba(255,255,255,.05);min-width:60px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 16px rgba(0,240,255,.45);transition:width .8s cubic-bezier(.2,.8,.3,1)}
input,select,textarea{width:100%;background:rgba(0,0,0,.42);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:9px;font-family:inherit;font-size:13.5px;outline:none;transition:all .16s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,.14)}
input[type=checkbox]{width:auto;accent-color:#00f0ff;transform:scale(1.2);cursor:pointer}
label.fl{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#modalRoot{position:fixed;inset:0;z-index:200;display:none}
#modalRoot.open{display:block}
.modal-back{position:absolute;inset:0;background:rgba(3,5,12,.82);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:860px;margin:auto;background:linear-gradient(180deg,#141a2e,#0d1120);border:1px solid var(--line);border-radius:16px;box-shadow:0 0 60px rgba(0,240,255,.22),0 0 120px rgba(255,43,214,.12);animation:popIn .24s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(0,240,255,.1),rgba(255,43,214,.08))}
.modal-head h3{font-size:14px;flex:1;color:#fff;text-shadow:0 0 12px rgba(0,240,255,.5)}
.modal-head .x{background:transparent;border:1px solid var(--line2);color:var(--magenta);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:900;transition:all .16s;flex:0 0 auto}
.modal-head .x:hover{background:rgba(255,43,214,.2);box-shadow:0 0 16px rgba(255,43,214,.5)}
.modal-body{padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
#toastRoot{position:fixed;right:14px;bottom:14px;z-index:300;display:flex;flex-direction:column;gap:9px;pointer-events:none;max-width:calc(100vw - 28px)}
.toast{background:linear-gradient(135deg,rgba(21,25,43,.97),rgba(11,13,23,.97));border:1px solid var(--cyan);border-left:4px solid var(--cyan);padding:11px 15px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 0 26px rgba(0,240,255,.35);animation:slideIn .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto}
.toast.err{border-color:var(--red);border-left-color:var(--red);box-shadow:0 0 26px rgba(255,77,109,.35)}
.toast.ok{border-color:var(--lime);border-left-color:var(--lime);box-shadow:0 0 26px rgba(139,255,60,.35)}
@keyframes slideIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.emoji{display:inline-block;transition:transform .25s cubic-bezier(.2,.9,.3,1.4);will-change:transform}
.btn:hover .emoji,.navbtn:hover .emoji,.card:hover .emoji{transform:translateY(-3px) scale(1.25) rotate(-9deg)}
.emoji.float{animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.emoji.wig{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.empty{text-align:center;padding:38px 16px;color:var(--dim);border:1px dashed var(--line);border-radius:14px;background:rgba(0,240,255,.025)}
.empty .big{font-size:40px;display:block;margin-bottom:10px;animation:floaty 3s ease-in-out infinite}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{color:#fff;font-variant-numeric:tabular-nums}
.statbox{background:rgba(0,240,255,.05);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:center}
.statbox .v{font-size:19px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(0,240,255,.5);font-variant-numeric:tabular-nums}
.statbox .l{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-top:2px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:16px 0}
.legtab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.legtab button{cursor:pointer;border:1px solid var(--line);background:rgba(0,240,255,.06);color:var(--txt);padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:1.2px;border-radius:8px;text-transform:uppercase;transition:all .16s;font-family:inherit}
.legtab button.on{background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#0b0d17;border-color:transparent;box-shadow:0 0 18px rgba(0,240,255,.55)}
.legtab button:hover{transform:translateY(-1px)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hint{font-size:11.5px;color:var(--dim);line-height:1.6}
.warnbox{border:1px solid rgba(255,213,61,.35);background:rgba(255,213,61,.07);border-radius:11px;padding:11px 13px;font-size:12.5px;color:#ffe9a8}
.kobracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kocol{min-width:180px;display:flex;flex-direction:column;gap:10px}
.ko-tie{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:rgba(0,240,255,.04);font-size:12.5px}
.ko-tie .tm{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.ko-tie .tm.win{color:var(--lime);font-weight:800;text-shadow:0 0 10px rgba(139,255,60,.5)}
.match-card{background:linear-gradient(135deg,rgba(21,25,43,.9),rgba(11,13,23,.9));border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;transition:all .2s ease;display:flex;flex-direction:column}
.match-card:hover{border-color:rgba(0,240,255,.5);box-shadow:0 4px 20px rgba(0,240,255,.15);transform:translateY(-2px)}
.mc-header{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed rgba(255,255,255,.08)}
.mc-body{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mc-team{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-weight:700;font-size:13px;line-height:1.2}
.mc-team.cl-side{cursor:pointer}
.mc-team.cl-side:hover .cl-name{color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,.55)}
.mc-score{font-size:22px;font-weight:900;color:#fff;background:rgba(0,0,0,.4);padding:4px 16px;border-radius:8px;border:1px solid rgba(0,240,255,.2);text-shadow:0 0 10px rgba(0,240,255,.3);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.mc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.08);font-size:11px;gap:8px}
.mc-legs{font-size:10.5px;color:var(--dim);text-align:center;margin-top:6px;letter-spacing:.5px;background:rgba(0,0,0,.2);padding:3px;border-radius:6px}
@keyframes awSweep{0%{transform:rotate(18deg) translateX(-140%)}55%,100%{transform:rotate(18deg) translateX(140%)}}
.aw-card{position:relative;overflow:hidden}

function money(n){n=Number(n)||0;const sign=n<0?'-':'';const a=Math.abs(n);if(a>=1e9)return sign+'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return sign+'$'+(a/1e6).toFixed(2)+'M';if(a>=1e3)return sign+'$'+(a/1e3).toFixed(0)+'K';return sign+'$'+a.toFixed(0);}
const num = n => (Number(n)||0).toLocaleString('en-US');

function isImageUrl(v){return typeof v==='string'&&(/^https?:\/\//i.test(v)||v.startsWith('data:image')||v.startsWith('blob:'));}

function teamLogo(team, size){
  size = Number(size) || 26;
  const cls = 'tlogo' + (size >= 38 ? ' lg' : (size <= 20 ? ' sm' : ''));
  const color = (team && team.color) || 'var(--dim)';

  const style = `width:${size}px;height:${size}px;border-color:${esc(color)};font-size:${Math.round(size * 0.56)}px;`;
  if (logo && isImageUrl(logo)) return `<span class="${cls}" style="${style}"><img src="${esc(logo)}" alt="${esc(name)}" loading="lazy"></span>`;
  if (logo) return `<span class="${cls}" style="${style}color:${esc(color)}">${esc(logo)}</span>`;
  const letter = name ? name.trim().charAt(0).toUpperCase() : '';
  return `<span class="${cls}" style="${style}color:${esc(color)}">${letter ? esc(letter) : '🛡️'}</span>`;
}

function teamLink(team, size){

  if (!exists) return `<span class="muted">${esc(team ? team.name : 'Unknown')}</span>`;

function teamTag(team, size){ if (!team) return ''; return `<span class="itag">${teamLogo(team, size || 22)}<span>${esc(team.name)}</span></span>`; }

function playerLink(p, color){

function teamSide(team, size, right){

  return `<div class="mc-team cl-side${right ? ' right' : ''}" data-act="team:view" data-id="${esc(team.id)}" title="Open ${esc(team.name)}">
    ${teamLogo(team, size || 42)}

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.innerHTML = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(60px)';
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

function poisson(lambda){
  const L = Math.exp(-Math.max(0.05, lambda));
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

const ECON_DEFAULT = {
  win: 15000000, draw: 5000000, loss: -10000000,
  goal: 2000000, assist: 1000000, save: 400000, tackle: 100000, foul: -500000,
  mvp: 3000000, motm: 3000000,
  teamStart: 250000000, playerStart: 1000000, cap: 1000000000,
  loanPct: 10, loanLegs: 2,
  enabled: { win:true, draw:true, loss:true, goal:true, assist:true, save:true, tackle:true, foul:true, mvp:true, motm:true }
};

const GRADE_DEFAULT = {
  S: { goals: 3.5, assists: 4, saves: 15, tackles: 10 },
  A: { goals: 2.5, assists: 2, saves: 10, tackles: 7 },
  B: { goals: 1.5, assists: 1, saves: 5,  tackles: 5 }
};

function defaultState(){
  return {
    leagueName: 'My League',
    seasonName: '2026 Season',
    teams: [], players: [], matches: [], fixtures: [], tournaments: [], archives: [], logs: [],
    guide: [{
      id: uuid(),
      title: 'Welcome to League Manager',
      content: 'Use the Registry to create teams and players. Then create fixtures and record or auto-generate results. Everything updates live: standings, awards, values and the Ballon d\'Or race.\n\nAdmins: log in via the Admin button to unlock editing, the transfer market, tournaments and season control.',
      createdAt: Date.now(), updatedAt: Date.now(), by: 'system'
    }],
    settings: {
      isAdmin: false,
      disabledAwards: [],
      economy: JSON.parse(JSON.stringify(ECON_DEFAULT)),
      grading: JSON.parse(JSON.stringify(GRADE_DEFAULT))
    }
  };
}

const app = {
  state: null, currentView: 'registry', user: null, isAdmin: false,
  firebaseReady, db: null, auth: null, _draft: null, _suppress: false, _cloudLoaded: false
};
window.app = app;
const econ = () => app.state.settings.economy;

function hydrate(raw){
  const d = defaultState();
  const s = Object.assign({}, d, raw || {});
  s.settings = Object.assign({}, d.settings, (raw && raw.settings) || {});
  const re = (raw && raw.settings && raw.settings.economy) || {};
  s.settings.economy = Object.assign({}, d.settings.economy, re);
  s.settings.economy.enabled = Object.assign({}, d.settings.economy.enabled, re.enabled || {});
  const rg = (raw && raw.settings && raw.settings.grading) || {};
  s.settings.grading = {};
  ['S','A','B'].forEach(k => s.settings.grading[k] = Object.assign({}, d.settings.grading[k], rg[k] || {}));
  if (!Array.isArray(s.settings.disabledAwards)) s.settings.disabledAwards = [];
  ['teams','players','matches','fixtures','tournaments','archives','logs','guide'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}

/* Migration: backfill playerTeams on matches, convert retired → freeAgent */
function migrate(){
  let changed = false;

  /* retired → freeAgent */
  app.state.players.forEach(p => {
    if (p.retired){
      p.freeAgent = true;
      delete p.retired;
      delete p.retiredAt;
      changed = true;
    }
    if (p.freeAgent === undefined){ p.freeAgent = false; changed = true; }
  });

  /* backfill playerTeams on matches */
  app.state.matches.forEach(m => {
    if (m.playerTeams) return;
    m.playerTeams = {};
    const A = m.teamAId, B = m.teamBId;
    Object.keys(m.playerStats || {}).forEach(pid => {
      const p = playerById(pid);
      if (!p) return;
      if (p.teamId === A || p.teamId === B) { m.playerTeams[pid] = p.teamId; return; }
      /* player has moved since; use earliest matching history */
      const hist = (p.transferHistory || []);
      for (const h of hist){
        if (h.from === A || h.from === B) { m.playerTeams[pid] = h.from; return; }
        if (h.to === A || h.to === B) { m.playerTeams[pid] = h.to; return; }
      }
      m.playerTeams[pid] = A;
    });
    changed = true;
  });

  return changed;
}

function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    app.state = hydrate(raw ? JSON.parse(raw) : null);
    const lg = localStorage.getItem(LS_LOGS);
    app.state.logs = lg ? JSON.parse(lg) : (app.state.logs || []);
    if (migrate()){
      try { localStorage.setItem(LS_KEY, JSON.stringify(app.state)); } catch(e){}
    }
  } catch(e){
    console.warn('localStorage load failed', e);
    app.state = hydrate(null);
  }
}

async function saveState(opts){
  opts = opts || {};
  if (firebaseReady && app.db && !app._cloudLoaded && !opts.force){
    toast('⏳ Still loading the cloud save, wait a second and try again', 'err');
    return;
  }
  if (!opts.silent) app._suppress = true;
  try { localStorage.setItem(LS_KEY, JSON.stringify(app.state)); } catch(e){ console.warn('LS save failed', e); }
  try { localStorage.setItem(LS_LOGS, JSON.stringify(app.state.logs.slice(-200))); } catch(e){}
  if (firebaseReady && app.db){
    try {
      await app.db.doc(DOC_PATH).set(JSON.parse(JSON.stringify(app.state)));
    } catch(e){
      console.warn('Firestore save failed', e);
      const why = e.code === 'permission-denied'
        ? 'Firestore rules blocked the write. Are you logged in as the admin email?'
        : e.code === 'invalid-argument' || /too large/i.test(e.message || '')
          ? 'The league document is too big for Firestore (1 MB limit).'
          : (e.code || e.message);
      toast('☁️ Cloud save failed, saved locally only: ' + why, 'err');
    }
  }
  setTimeout(() => { app._suppress = false; }, 400);
}

async function logAdmin(action, before, after){
  const entry = { ts: Date.now(), email: (app.user && app.user.email) || 'local-admin', action,
    before: before === undefined ? null : before, after: after === undefined ? null : after };
  app.state.logs.push(entry);
  if (app.state.logs.length > 200) app.state.logs = app.state.logs.slice(-200);
  try { localStorage.setItem(LS_LOGS, JSON.stringify(app.state.logs)); } catch(e){}
  if (firebaseReady && app.db){
    try { await app.db.collection(LOGS_COL).add(entry); } catch(e){ console.warn('log write failed', e); }
  }
}

function initFirebase(){
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    app.db = firebase.firestore();
    app.auth = firebase.auth();
    $('#cloudBadge').textContent = 'CLOUD';
    $('#cloudBadge').className = 'cloud-badge on';

    app.db.doc(DOC_PATH).onSnapshot(snap => {
      app._cloudLoaded = true;
      if (!snap.exists) return;
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (app._suppress) return;
      app.state = hydrate(snap.data());
      if (migrate()) saveState({ silent:true, force:true });
      render();
    }, err => {
      console.warn('snapshot error', err);
      toast('☁️ Could not read the cloud save, editing is locked until reload: ' + (err.code || err.message), 'err');
    });

    app.auth.onAuthStateChanged(async u => {
      app.user = u;
      if (!u){ app.isAdmin = false; }
      else {
        let claim = false;
        try { const t = await u.getIdTokenResult(); claim = t.claims && t.claims.admin === true; } catch(e){}
        app.isAdmin = ADMIN_EMAILS.includes(u.email) || claim;
        if (!app.isAdmin) toast('⚠️ Signed in, but this email is not in ADMIN_EMAILS', 'err');
      }
      render();
    });
  } catch(e){
    console.warn('Firebase init failed, local mode', e);
    // Fall back completely to local mode. Leaving firebaseReady true here
    // incorrectly disabled local-admin login after SDK/network initialization errors.
    firebaseReady = false;
    app.firebaseReady = false;
    app.db = null;
    app.auth = null;
    app._cloudLoaded = true;
    $('#cloudBadge').textContent = 'LOCAL';
    $('#cloudBadge').className = 'cloud-badge off';
  }
}

const teamById   = id => app.state.teams.find(t => t.id === id) || { id, name:'Unknown', color:'#666', value:0, stats:{} };
const playerById = id => app.state.players.find(p => p.id === id);
const fixtureById= id => app.state.fixtures.find(f => f.id === id);
const tourById   = id => app.state.tournaments.find(t => t.id === id);
const matchById  = id => app.state.matches.find(m => m.id === id);

/* A player is on an active roster if not a free agent */
const isActivePlayer = p => p && !p.freeAgent;

function matchLegs(m){
  const legs = [];
  for (let i = 1; i <= 4; i++){
    const a = m['leg'+i+'ScoreA'], b = m['leg'+i+'ScoreB'];
    if (a === null || a === undefined || a === '' || b === null || b === undefined || b === '') continue;
    legs.push({ n:i, a:Number(a), b:Number(b) });
  }
  return legs;
}
function matchAggregate(m){
  const legs = matchLegs(m);
  let a = 0, b = 0;
  legs.forEach(l => { a += l.a; b += l.b; });
  return { legs, a, b, res: a > b ? 'A' : (b > a ? 'B' : 'D') };
}
function legCount(m){
  for (let i = 4; i >= 1; i--){
    const a = m['leg'+i+'ScoreA'];
    if (a !== null && a !== undefined && a !== '') return i;
  }
  return 0;
}

/* Which team did this player play for in this match? Snapshot-based. */
function teamForMatch(m, pid){
  if (m.playerTeams && m.playerTeams[pid]) return m.playerTeams[pid];
  const p = playerById(pid);
  return p ? p.teamId : null;
}

function computePlayerStats(){
  const E = econ();
  const st = {};
  const get = id => st[id] || (st[id] = {
    goals:0, assists:0, saves:0, tackles:0, fouls:0, legsPlayed:0, legs:0,
    mvp:0, motm:0, matches:0, growth:0, playerValue:0, marketValue:0,
    legLog: []
  });

  app.state.players.forEach(p => get(p.id));

  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    const playedSet = new Set();

    Object.keys(ps).forEach(pid => {
      if (!playerById(pid)) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      const s = get(pid);
      let playedAny = false;
      legs.forEach((lg, i) => {
        if (!lg || !lg.played) return;
        if (i >= agg.legs.length) return;
        playedAny = true;
        s.legsPlayed++;
        const g = +lg.goals || 0, a = +lg.assists || 0, sv = +lg.saves || 0, tk = +lg.tackles || 0, fl = +lg.fouls || 0;
        s.goals += g; s.assists += a; s.saves += sv; s.tackles += tk; s.fouls += fl;
        s.legLog.push({ matchId: m.id, leg: i + 1, g, a, s: sv, t: tk, f: fl });
      });
      if (playedAny) playedSet.add(pid);
    });

    playedSet.forEach(pid => get(pid).matches++);
    if (m.mvpId && playerById(m.mvpId))  get(m.mvpId).mvp++;
    if (m.motmId && playerById(m.motmId)) get(m.motmId).motm++;
  });

  app.state.players.forEach(p => {
    const s = get(p.id);
    const en = E.enabled;
    let growth = 0;
    if (en.goal)   growth += s.goals   * E.goal;
    if (en.assist) growth += s.assists * E.assist;
    if (en.save)   growth += s.saves   * E.save;
    if (en.tackle) growth += s.tackles * E.tackle;
    if (en.foul)   growth += s.fouls   * E.foul;
    if (en.mvp)    growth += s.mvp     * E.mvp;
    if (en.motm)   growth += s.motm    * E.motm;
    s.growth = growth;
    const start = (p.startingValue === undefined || p.startingValue === null) ? E.playerStart : p.startingValue;
    s.startingValue = start;
    s.playerValue = Math.min(E.cap, start + growth);
    s.marketValue = s.playerValue;
  });

  return st;
}

function gradingCfg(){ return app.state.settings.grading; }

function gradeStats(goals, assists, saves, tackles){
  const C = gradingCfg();
  const clears = k => {
    const c = C[k] || {};
    const bars = [
      [+c.goals   || 0, +goals   || 0],
      [+c.assists || 0, +assists || 0],
      [+c.saves   || 0, +saves   || 0],
      [+c.tackles || 0, +tackles || 0]
    ];
    return bars.some(([need, got]) => need > 0 && got >= need);
  };
  if (clears('S')) return 'S';
  if (clears('A')) return 'A';
  if (clears('B')) return 'B';
  return 'C';
}

function legGrade(l){
  l = l || {};
  const g = (l.g !== undefined && l.g !== null) ? l.g : (l.goals || 0);
  const a = (l.a !== undefined && l.a !== null) ? l.a : (l.assists || 0);
  const s = (l.s !== undefined && l.s !== null) ? l.s : (l.saves || 0);
  const t = (l.t !== undefined && l.t !== null) ? l.t : (l.tackles || 0);
  return gradeStats(+g || 0, +a || 0, +s || 0, +t || 0);
}

function avgGrade(avg){
  avg = avg || {};
  return gradeStats(+avg.goals || 0, +avg.assists || 0, +avg.saves || 0, +avg.tackles || 0);
}

function playerAverages(st){
  const n = Math.max(1, st.legsPlayed);
  return {
    goals: st.goals / n, assists: st.assists / n,
    saves: st.saves / n, tackles: st.tackles / n,
    fouls: (st.fouls || 0) / n, games: st.legsPlayed
  };
}

function computeStandings(){
  const map = {};
  app.state.teams.forEach(t => {
    map[t.id] = { id:t.id, name:t.name, color:t.color, value:t.value || 0,
      mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0,
      form:[], comebacks:0, streak:0, best:0, wall:0 };
  });

  const ms = app.state.matches.slice().sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
  ms.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const A = map[m.teamAId], B = map[m.teamBId];
    if (!A || !B) return;

    A.mp++; B.mp++;
    A.gf += agg.a; A.ga += agg.b;
    B.gf += agg.b; B.ga += agg.a;

    if (agg.res === 'A'){
      A.w++; B.l++; A.pts += 3;
      A.form.push('W'); B.form.push('L');
      A.streak++; B.streak = 0;
      if (A.streak > A.best) A.best = A.streak;
      const l1 = agg.legs[0];
      if (l1 && l1.a <= l1.b) A.comebacks++;
    } else if (agg.res === 'B'){
      B.w++; A.l++; B.pts += 3;
      B.form.push('W'); A.form.push('L');
      B.streak++; A.streak = 0;
      if (B.streak > B.best) B.best = B.streak;
      const l1 = agg.legs[0];
      if (l1 && l1.b <= l1.a) B.comebacks++;
    } else {
      A.d++; B.d++; A.pts++; B.pts++;
      A.form.push('D'); B.form.push('D');
      A.streak = 0; B.streak = 0;
    }
  });

  /* Wall — attribute to snapshot team */
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    Object.keys(ps).forEach(pid => {
      if (!playerById(pid)) return;
      const tid = teamForMatch(m, pid);
      if (!tid || !map[tid]) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      legs.forEach((lg, i) => {
        if (!lg || !lg.played || i >= agg.legs.length) return;
        map[tid].wall += (+lg.tackles||0) + (+lg.saves||0);
      });
    });
  });

  Object.values(map).forEach(r => { r.gd = r.gf - r.ga; });
  return map;
}

function standingsSorted(){
  const arr = Object.values(computeStandings());
  arr.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
  return arr;
}

function headToHead(teamA, teamB){
  let aGoals = 0, bGoals = 0, aWins = 0, bWins = 0, draws = 0;
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const isA = m.teamAId === teamA && m.teamBId === teamB;
    const isB = m.teamAId === teamB && m.teamBId === teamA;
    if (!isA && !isB) return;
    const ga = isA ? agg.a : agg.b;
    const gb = isA ? agg.b : agg.a;
    aGoals += ga; bGoals += gb;
    if (ga > gb) aWins++; else if (gb > ga) bWins++; else draws++;
  });
  return { aGoals, bGoals, aWins, bWins, draws };
}

function topContributorsPerLeg(){
  const out = [];
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    for (let i = 0; i < agg.legs.length; i++){
      const byTeam = {};
      Object.keys(ps).forEach(pid => {
        const p = playerById(pid);
        if (!p) return;
        const lg = (ps[pid] || [])[i];
        if (!lg || !lg.played) return;
        const tid = teamForMatch(m, pid);
        if (!tid) return;
        const score = (+lg.goals||0)*5 + (+lg.assists||0)*3 + (+lg.saves||0)*1 + (+lg.tackles||0)*0.5;
        (byTeam[tid] = byTeam[tid] || []).push({ pid, score, g:+lg.goals||0, a:+lg.assists||0 });
      });
      Object.keys(byTeam).forEach(tid => {
        byTeam[tid].sort((x,y) => y.score - x.score);
        out.push({ matchId:m.id, leg:i+1, teamId:tid, players: byTeam[tid] });
      });
    }
  });
  return out;
}

function oneManArmy(){
  const counts = {};
  topContributorsPerLeg().forEach(entry => {
    if (!entry.players.length) return;
    const top = entry.players[0];
    if (top.score <= 0) return;
    counts[top.pid] = (counts[top.pid] || 0) + 1;
  });
  return counts;
}

function bestDuo(){
  let best = null;
  topContributorsPerLeg().forEach(entry => {
    if (entry.players.length < 2) return;
    const a = entry.players[0], b = entry.players[1];
    const total = (a.g + a.a) + (b.g + b.a);
    if (!best || total > best.total){
      const p1 = playerById(a.pid);
      const p2 = playerById(b.pid);
      if (!p1 || !p2) return;
      best = { total, a, b, teamId: entry.teamId, matchId: entry.matchId, leg: entry.leg, label: `${p1.name} & ${p2.name}` };
    }
  });
  return best;
}

function ballonDor(){
  const st = computePlayerStats();
  const table = standingsSorted();
  const rankOf = {};
  table.forEach((r, i) => rankOf[r.id] = i + 1);
  const totalTeams = Math.max(1, app.state.teams.length);

  const best = key => {
    let b = null, bv = -1;
    Object.keys(st).forEach(pid => {
      if (!playerById(pid)) return;
      if (st[pid][key] > bv){ bv = st[pid][key]; b = pid; }
    });
    return bv > 0 ? b : null;
  };
  const bootId = best('goals'), playId = best('assists'), gloveId = best('saves'), defId = best('tackles');
  const oma = oneManArmy();

  const rows = app.state.players.map(p => {
    const s = st[p.id] || {};
    const rank = rankOf[p.teamId] || totalTeams;
    const teamBonus = Math.max(0, 100 - (rank - 1) * 15);
    const pts =
      (s.goals||0)*5 + (s.assists||0)*5 + (s.saves||0)*1 + (s.tackles||0)*0.2 +
      ((s.mvp||0) + (s.motm||0)) * 10 + teamBonus +
      (p.id === bootId  ? 50 : 0) + (p.id === playId  ? 50 : 0) +
      (p.id === gloveId ? 50 : 0) + (p.id === defId   ? 50 : 0) +
      ((oma[p.id]||0) * 8);
    return { player: p, pts, s, rank, teamBonus };
  });
  rows.sort((a,b) => b.pts - a.pts);
  return rows;
}

function teamStrength(teamId){
  const ps = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  if (!ps.length) return 1;
  const st = computePlayerStats();
  const vals = ps.map(p => st[p.id] ? st[p.id].playerValue : econ().playerStart);
  const avg = vals.reduce((a,b) => a + b, 0) / vals.length;
  const treasury = Math.max(0, teamById(teamId).value || 0);
  return Math.max(0.4, (avg / 1e6) * 0.6 + (treasury / 1e8) * 0.4);
}

function pickWeighted(list, weightFn){
  let total = 0;
  list.forEach(x => total += Math.max(0.0001, weightFn(x)));
  let r = Math.random() * total;
  for (const x of list){
    r -= Math.max(0.0001, weightFn(x));
    if (r <= 0) return x;
  }
  return list[list.length - 1];
}

function simulateTeamLeg(teamId, goals, conceded, legIndex){
  const roster = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  const st = computePlayerStats();
  const out = {};
  if (!roster.length) return out;
  const w = p => (st[p.id] ? st[p.id].playerValue : 1e6);

  roster.forEach(p => {
    out[p.id] = { played: true, goals:0, assists:0, saves:0, tackles:0, fouls:0 };
  });

  for (let i = 0; i < goals; i++){
    const scorer = pickWeighted(roster, w);
    out[scorer.id].goals++;
    if (Math.random() < 0.68){
      const others = roster.filter(p => p.id !== scorer.id);
      if (others.length) out[pickWeighted(others, w).id].assists++;
    }
  }

  roster.forEach(p => {
    const s = st[p.id];
    const defensiveBias = s ? (s.tackles + 1) / (s.goals + s.assists + 1) : 1;
    out[p.id].tackles = Math.round(Math.random() * 4 * clamp(defensiveBias, 0.4, 2));
    out[p.id].saves   = Math.round(Math.random() * (conceded > 0 ? 5 : 3) * clamp(defensiveBias, 0.4, 2));
  });

  roster.forEach(p => { if (Math.random() < 0.12) out[p.id].played = false; });
  return out;
}

function simulateFixture(fixtureId){
  const f = fixtureById(fixtureId);
  if (!f) return null;

  const legs = f.legs || 1;
  const sA = teamStrength(f.teamAId);
  const sB = teamStrength(f.teamBId);
  const total = sA + sB || 1;
  const expA = 3.1 * (sA / total);
  const expB = 3.1 * (sB / total);

  const m = {
    id: uuid(),
    teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id,
    timestamp: Date.now(),
    mvpId: null, motmId: null, mvpSnapshot: null, motmSnapshot: null,
    playerStats: {}, playerTeams: {}
  };

  for (let i = 1; i <= legs; i++){
    const ga = poisson(expA * (1 + (Math.random() - 0.5) * 0.3));
    const gb = poisson(expB * (1 + (Math.random() - 0.5) * 0.3));
    m['leg'+i+'ScoreA'] = ga;
    m['leg'+i+'ScoreB'] = gb;

    const statsA = simulateTeamLeg(f.teamAId, ga, gb, i);
    const statsB = simulateTeamLeg(f.teamBId, gb, ga, i);

    Object.keys(statsA).forEach(pid => {
      m.playerStats[pid] = m.playerStats[pid] || [];
      while (m.playerStats[pid].length < i) m.playerStats[pid].push({ played:false, goals:0, assists:0, saves:0, tackles:0, fouls:0 });
      m.playerStats[pid][i-1] = statsA[pid];
      m.playerTeams[pid] = f.teamAId;
    });
    Object.keys(statsB).forEach(pid => {
      m.playerStats[pid] = m.playerStats[pid] || [];
      while (m.playerStats[pid].length < i) m.playerStats[pid].push({ played:false, goals:0, assists:0, saves:0, tackles:0, fouls:0 });
      m.playerStats[pid][i-1] = statsB[pid];
      m.playerTeams[pid] = f.teamBId;
    });
  }
  for (let i = legs + 1; i <= 4; i++){ m['leg'+i+'ScoreA'] = null; m['leg'+i+'ScoreB'] = null; }

  const contrib = pid => {
    const legsArr = m.playerStats[pid] || [];
    let s = 0;
    legsArr.forEach(l => { if (l && l.played) s += (l.goals||0)*5 + (l.assists||0)*3 + (l.saves||0) + (l.tackles||0)*0.5; });
    return s;
  };

  const sideA = app.state.players.filter(p => p.teamId === f.teamAId && m.playerStats[p.id]);
  const sideB = app.state.players.filter(p => p.teamId === f.teamBId && m.playerStats[p.id]);
  const allPlayers = sideA.concat(sideB).sort((a,b) => contrib(b.id) - contrib(a.id));

  m.mvpId = allPlayers[0]?.id || null;
  m.motmId = allPlayers[1]?.id || allPlayers[0]?.id || null;

  if (m.mvpId){ const p = playerById(m.mvpId); m.mvpSnapshot = p ? { name:p.name, teamId:p.teamId } : null; }
  if (m.motmId){ const p = playerById(m.motmId); m.motmSnapshot = p ? { name:p.name, teamId:p.teamId } : null; }

  applyMatchToState(m, f);
  return m;
}

function applyMatchToState(m, fixture){
  if (!m.playerTeams){
    m.playerTeams = {};
    Object.keys(m.playerStats || {}).forEach(pid => {
      const p = playerById(pid);
      if (p && p.teamId) m.playerTeams[pid] = p.teamId;
    });
  }

  const E = econ();
  const agg = matchAggregate(m);
  const A = app.state.teams.find(t => t.id === m.teamAId);
  const B = app.state.teams.find(t => t.id === m.teamBId);

  if (A && B){
    if (agg.res === 'A'){
      if (E.enabled.win)  A.value += E.win;
      if (E.enabled.loss) B.value += E.loss;
    } else if (agg.res === 'B'){
      if (E.enabled.win)  B.value += E.win;
      if (E.enabled.loss) A.value += E.loss;
    } else {
      if (E.enabled.draw){ A.value += E.draw; B.value += E.draw; }
    }
  }

  app.state.matches.push(m);

  if (fixture){ fixture.played = true; fixture.matchId = m.id; }

  app.state.players.forEach(p => {
    if (p.loanStatus && p.loanStatus.legsRemaining > 0 && (p.teamId === m.teamAId || p.teamId === m.teamBId)){
      p.loanStatus.legsRemaining -= agg.legs.length;
      if (p.loanStatus.legsRemaining <= 0){
        p.teamId = p.loanStatus.from;
        p.loanStatus = null;
      }
    }
  });

  if (fixture && fixture.tournamentId) progressTournament(fixture.tournamentId);
}

function createTournament(name, teamIds, groupCount, koLegs){
  const t = {
    id: uuid(), name: name || 'Cup', format: 'Groups + Knockout',
    teams: teamIds.slice(), groups: [], groupCount, koLegs: koLegs || 1,
    phase: 'group', started: Date.now(), completed: false, winner: null, created: Date.now(), ko: null
  };

  const buckets = Array.from({ length: groupCount }, () => []);
  teamIds.forEach((id, i) => {
    const round = Math.floor(i / groupCount);
    const idx = round % 2 === 0 ? (i % groupCount) : (groupCount - 1 - (i % groupCount));
    buckets[idx].push(id);
  });
  t.groups = buckets;
  app.state.tournaments.push(t);

  t.groups.forEach((g, gi) => {
    for (let i = 0; i < g.length; i++){
      for (let j = i + 1; j < g.length; j++){
        for (let leg = 1; leg <= 2; leg++){
          app.state.fixtures.push({
            id: uuid(),
            teamAId: leg === 1 ? g[i] : g[j],
            teamBId: leg === 1 ? g[j] : g[i],
            competition: 'Tournament',
            round: 'Group ' + String.fromCharCode(65 + gi),
            date: '', legs: 1, played: false, stage: 'group',
            tournamentId: t.id, group: gi
          });
        }
      }
    }
  });
  return t;
}

function groupStandings(t, gi){
  const ids = t.groups[gi] || [];
  const map = {};
  ids.forEach(id => {
    const tm = teamById(id);
    map[id] = { id, name: tm.name, color: tm.color, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 };
  });
  const fixtures = app.state.fixtures.filter(f => f.tournamentId === t.id && f.stage === 'group' && f.group === gi);
  fixtures.forEach(f => {
    if (!f.played) return;
    const m = app.state.matches.find(x => x.id === f.matchId);
    if (!m) return;
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const A = map[m.teamAId], B = map[m.teamBId];
    if (!A || !B) return;
    A.mp++; B.mp++;
    A.gf += agg.a; A.ga += agg.b; B.gf += agg.b; B.ga += agg.a;
    if (agg.res === 'A'){ A.w++; B.l++; A.pts += 3; }
    else if (agg.res === 'B'){ B.w++; A.l++; B.pts += 3; }
    else { A.d++; B.d++; A.pts++; B.pts++; }
  });
  Object.values(map).forEach(r => r.gd = r.gf - r.ga);
  return Object.values(map).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
}

function groupComplete(t){
  const fx = app.state.fixtures.filter(f => f.tournamentId === t.id && f.stage === 'group');
  return fx.length > 0 && fx.every(f => f.played);
}

function advanceToKnockout(tid){
  const t = tourById(tid);
  if (!t) return;
  if (!groupComplete(t)){ toast('⚠️ Group stage is not finished yet', 'err'); return; }

  const qualifiers = [];
  t.groups.forEach((g, gi) => {
    const tbl = groupStandings(t, gi);
    tbl.slice(0, 2).forEach((r, idx) => qualifiers.push({ teamId: r.id, seed: gi * 2 + idx + 1, pts: r.pts, gd: r.gd }));
  });
  qualifiers.sort((a,b) => b.pts - a.pts || b.gd - a.gd);
  qualifiers.forEach((q, i) => q.seed = i + 1);

  const qIds = qualifiers.map(q => q.teamId);
  const rounds = [];

  if (qIds.length === 4){
    rounds.push({ name:'Semi-finals', ties: [
      { a: qIds[0], b: qIds[3], winner:null, fixtureIds:[] },
      { a: qIds[1], b: qIds[2], winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Final', ties:[ { a:null, b:null, winner:null, fixtureIds:[] } ]});
  } else if (qIds.length === 6){
    rounds.push({ name:'Quarter-finals', ties: [
      { a: qIds[2], b: qIds[5], winner:null, fixtureIds:[] },
      { a: qIds[3], b: qIds[4], winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Semi-finals', ties: [
      { a: qIds[0], b:null, winner:null, fixtureIds:[] },
      { a: qIds[1], b:null, winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Final', ties:[ { a:null, b:null, winner:null, fixtureIds:[] } ]});
  } else {
    toast('⚠️ Need 4 or 6 qualifiers', 'err'); return;
  }

  t.ko = { rounds };
  t.phase = 'knockout';
  materializeKO(t);
  toast('🏁 Knockout stage generated!', 'ok');
}

function materializeKO(t){
  if (!t.ko) return;
  t.ko.rounds.forEach((round, ri) => {
    round.ties.forEach((tie, ti) => {
      if (tie.fixtureIds && tie.fixtureIds.length) return;
      if (!tie.a || !tie.b) return;
      tie.fixtureIds = [];
      const legs = t.koLegs || 1;
      for (let l = 1; l <= legs; l++){
        const f = {
          id: uuid(),
          teamAId: l % 2 === 1 ? tie.a : tie.b,
          teamBId: l % 2 === 1 ? tie.b : tie.a,
          competition: 'Tournament', round: round.name, date: '',
          legs: 1, played: false, stage: 'ko',
          tournamentId: t.id, koRound: ri, koTie: ti
        };
        app.state.fixtures.push(f);
        tie.fixtureIds.push(f.id);
      }
    });
  });
}

function progressTournament(tid){
  const t = tourById(tid);
  if (!t || !t.ko) return;

  t.ko.rounds.forEach((round, ri) => {
    round.ties.forEach((tie, ti) => {
      if (tie.winner) return;
      if (!tie.fixtureIds || !tie.fixtureIds.length) return;
      const fxs = tie.fixtureIds.map(fixtureById).filter(Boolean);
      if (!fxs.length || !fxs.every(f => f.played)) return;

      let aggA = 0, aggB = 0;
      fxs.forEach(f => {
        const m = app.state.matches.find(x => x.id === f.matchId);
        if (!m) return;
        const agg = matchAggregate(m);
        if (m.teamAId === tie.a){ aggA += agg.a; aggB += agg.b; }
        else { aggA += agg.b; aggB += agg.a; }
      });
      tie.winner = aggA >= aggB ? tie.a : tie.b;

      const next = t.ko.rounds[ri + 1];
      if (next){
        if (ri === 0 && t.ko.rounds.length === 2) {
          next.ties[0][ti === 0 ? 'a' : 'b'] = tie.winner;
        } else if (ri === 0 && t.ko.rounds.length === 3) {
          next.ties[ti].b = tie.winner;
        } else if (ri === 1 && t.ko.rounds.length === 3) {
          next.ties[0][ti === 0 ? 'a' : 'b'] = tie.winner;
        }
        materializeKO(t);
      } else {
        t.completed = true;
        t.phase = 'done';
        t.winner = tie.winner;
        toast('🏆 ' + teamById(tie.winner).name + ' wins ' + t.name + '!', 'ok');
      }
    });
  });
}

function rebuildTournamentKO(tid) {
  const t = tourById(tid);
  if (!t || !t.ko) return;
  t.ko.rounds.forEach(r => r.ties.forEach(tie => { tie.winner = null; }));
  if (t.ko.rounds.length === 2) {
    t.ko.rounds[1].ties[0].a = null;
    t.ko.rounds[1].ties[0].b = null;
  } else if (t.ko.rounds.length === 3) {
    t.ko.rounds[1].ties[0].b = null;
    t.ko.rounds[1].ties[1].b = null;
    t.ko.rounds[2].ties[0].a = null;
    t.ko.rounds[2].ties[0].b = null;
  }
  t.completed = false;
  t.phase = 'knockout';
  t.winner = null;
  progressTournament(tid);
}

function roundRobinRounds(ids){
  const list = ids.slice();
  if (list.length % 2) list.push(null);
  const n = list.length;
  const rounds = [];
  for (let r = 0; r < n - 1; r++){
    const pairs = [];
    for (let i = 0; i < n / 2; i++){
      const a = list[i], b = list[n - 1 - i];
      if (a && b) pairs.push([a, b]);
    }
    rounds.push(pairs);
    list.splice(1, 0, list.pop());
  }
  return rounds;
}

function fixtureRoundNum(f){
  const m = String((f && f.round) || '').match(/(\d+)/);
  return m ? Number(m[1]) : 9000;
}

/* Per-round ordering: uses `order` when set, else global index as fallback */
function sortedFixtures(list){
  const globalIdx = new Map(app.state.fixtures.map((f, i) => [f.id, i]));
  return list.slice().sort((a, b) => {
    const rd = fixtureRoundNum(a) - fixtureRoundNum(b);
    if (rd) return rd;
    const oa = (a.order !== undefined && a.order !== null) ? a.order : globalIdx.get(a.id);
    const ob = (b.order !== undefined && b.order !== null) ? b.order : globalIdx.get(b.id);
    if (oa !== ob) return oa - ob;
    return (globalIdx.get(a.id) || 0) - (globalIdx.get(b.id) || 0);
  });
}

/* Renumber only within a round */
function normalizeRound(roundName){
  const same = app.state.fixtures.filter(f => f.round === roundName && !f.tournamentId);
  const sorted = sortedFixtures(same);
  sorted.forEach((x, n) => { x.order = n; });
}

function moveFixture(id, dir){
  const f = fixtureById(id);
  if (!f || f.tournamentId) return false;
  const sameRound = app.state.fixtures.filter(x => x.round === f.round && !x.tournamentId);
  const sorted = sortedFixtures(sameRound);
  const i = sorted.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return false;
  [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
  sorted.forEach((x, n) => { x.order = n; });
  return true;
}

        <span class="pill ${f.played ? 'li' : 'cy'}" style="font-size:9.5px">${f.played ? 'FINISHED' : 'PENDING'}</span>
        <div class="row" style="gap:6px">
          ${app.isAdmin && !f.played && !isTournament ? `
            <button class="btn sm" data-act="fixture:move" data-id="${f.id}" data-dir="-1" ${localI <= 0 ? 'disabled' : ''} title="Move up">↑</button>
            <button class="btn sm" data-act="fixture:move" data-id="${f.id}" data-dir="1" ${localI === roundFxs.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
            <button class="btn sm" data-act="fixture:edit" data-id="${f.id}" title="Edit">✏️</button>` : ''}
          ${app.isAdmin ? (
            f.played
              ? `<button class="btn sm" data-act="match:view" data-id="${f.matchId}">📊</button>
                 <button class="btn sm" data-act="match:edit" data-id="${f.matchId}">✏️</button>
                 <button class="btn sm danger" data-act="match:del" data-id="${f.matchId}">🗑️</button>`
              : `<button class="btn sm lime" data-act="track:open" data-id="${f.id}">▶️</button>
                 <button class="btn sm" data-act="match:record" data-id="${f.id}">📝</button>`
          ) : (f.played ? `<button class="btn sm" data-act="match:view" data-id="${f.matchId}">📊</button>` : '')}
          ${app.isAdmin && !isTournament ? `<button class="btn sm danger" data-act="fixture:del" data-id="${f.id}">🗑️</button>` : ''}
        </div>
      </div>
    </div>`;
  };

  let upHTML = '';
  if (!upcoming.length){
    upHTML = `<div class="empty"><span class="big">📭</span>No upcoming fixtures</div>`;
  } else {
    let lastRound = null, open = false;
    upcoming.forEach((f, i) => {
      if (f.round !== lastRound){
        if (open) upHTML += `</div>`;
        upHTML += `<div class="tiny" style="color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px">${esc(f.round || 'No matchday')}</div><div class="grid g2">`;
        lastRound = f.round; open = true;
      }
      upHTML += fxRow(f, i, upcoming);
    });
    if (open) upHTML += `</div>`;
  }

  return `<div class="view-head">
    <h2><span class="emoji float">📅</span> Fixtures</h2>
    <div class="head-actions">
      ${app.isAdmin ? `
        <button class="btn lime" data-act="fixture:create"><span class="emoji">➕</span> Fixture</button>
        <button class="btn" data-act="fixture:autogen"><span class="emoji">🔁</span> Auto Fixtures</button>
        <button class="btn" data-act="report:open"><span class="emoji">📋</span> Paste Report</button>
        <button class="btn magenta" data-act="tournament:create"><span class="emoji">🏆</span> Tournament</button>
      ` : ''}
    </div>
  </div>

  <div class="section-title">Upcoming (${upcoming.length})</div>
  ${upHTML}

  <div class="section-title">Completed (${done.length})</div>
  <div class="grid g2">${done.length ? done.map((f, i) => fxRow(f, i, done)).join('') : '<div class="empty"><span class="big">🗂️</span>No completed fixtures</div>'}</div>`;
};

VIEWS.results = () => {
  const s = app.state;
  const ms = s.matches.slice().sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  if (!ms.length) return `<div class="view-head"><h2><span class="emoji float">📊</span> Results</h2></div><div class="empty"><span class="big">🎯</span>No results recorded yet.</div>`;

  let html = `<div class="view-head"><h2><span class="emoji float">📊</span> Results <span class="muted small">(${ms.length})</span></h2></div><div class="grid g2">`;
  ms.forEach(m => {
    const A = teamById(m.teamAId), B = teamById(m.teamBId);
    const agg = matchAggregate(m);
    const mvp = m.mvpId ? playerById(m.mvpId) : null;
    const motm = m.motmId ? playerById(m.motmId) : null;
    const legsTxt = agg.legs.map(l => `${l.a}-${l.b}`).join(' • ');
    const scoreColor = agg.res === 'A' ? 'var(--lime)' : agg.res === 'B' ? 'var(--magenta)' : 'var(--gold)';

    html += `<div class="match-card anim">
      <div class="mc-header">
        <span>${new Date(m.timestamp || Date.now()).toLocaleDateString()}</span>
        <span>${agg.legs.length} Leg${agg.legs.length > 1 ? 's' : ''}</span>
      </div>
      <div class="mc-body">
        ${teamSide(A, 42)}
        <div class="mc-score" style="color:${scoreColor}">${agg.a} - ${agg.b}</div>
        ${teamSide(B, 42, true)}
      </div>
      <div class="mc-legs">${legsTxt || '—'}</div>
      <div class="mc-footer">
        <div class="row" style="gap:6px">
          ${mvp ? `<span class="pill go tiny" title="MVP">🏅 ${playerLink(mvp)}</span>` : ''}
          ${motm ? `<span class="pill mg tiny" title="MOTM">⭐ ${playerLink(motm)}</span>` : ''}
        </div>
        <div class="row" style="gap:6px">
          <button class="btn sm" data-act="match:view" data-id="${m.id}">📊</button>
          ${app.isAdmin ? `<button class="btn sm" data-act="match:edit" data-id="${m.id}">✏️</button>
          <button class="btn sm danger" data-act="match:del" data-id="${m.id}">🗑️</button>` : ''}
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
};

VIEWS.standings = () => {
  const table = standingsSorted();
  if (!table.length) return `<div class="view-head"><h2><span class="emoji float">🏆</span> Standings</h2></div><div class="empty"><span class="big">📉</span>No standings yet.</div>`;

  const maxVal = Math.max(...table.map(t => t.value), 1);
  let html = `<div class="view-head"><h2><span class="emoji float">🏆</span> Standings</h2></div>`;
  html += `<div class="tblwrap"><table>
    <thead><tr>
      <th>#</th><th>Team</th><th class="num">MP</th><th class="num">W</th><th class="num">D</th><th class="num">L</th>
      <th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">PTS</th>
      <th>Form</th><th class="num">Treasury</th>
    </tr></thead><tbody>
    ${table.map((t, i) => {
      const form = t.form.slice(-5);
      return `<tr class="${i < 3 ? 'top' + (i + 1) : ''}">
        <td><span class="rk ${i === 0 ? 'rank1' : i === 1 ? 'rank2' : i === 2 ? 'rank3' : 'rk-D'}">${i+1}</span></td>
        <td>${teamLink(teamById(t.id), 22)}</td>
        <td class="num">${t.mp}</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td>
        <td class="num">${t.gf}</td><td class="num">${t.ga}</td>
        <td class="num" style="color:${t.gd > 0 ? 'var(--lime)' : t.gd < 0 ? 'var(--red)' : 'var(--dim)'}">${t.gd > 0 ? '+' : ''}${t.gd}</td>
        <td class="num" style="color:var(--gold);font-weight:900">${t.pts}</td>
        <td>${form.map(f => `<span class="badge b-${f}">${f}</span>`).join('')}</td>
        <td class="num" style="color:var(--gold)">${money(t.value)}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;

  html += `<div class="section-title">Team Value Chart</div><div class="card anim">`;
  table.slice().sort((a,b) => b.value - a.value).forEach(t => {
    html += `<div style="margin-bottom:9px">
      <div class="between tiny" style="margin-bottom:3px">
        <span>${teamLink(teamById(t.id), 20)}</span>
        <b class="mono" style="color:var(--gold)">${money(t.value)}</b>
      </div>
      <div class="bar"><span style="width:${Math.max(2, (t.value / maxVal) * 100)}%"></span></div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Head-to-Head Matrix</div><div class="tblwrap"><table>
    <thead><tr><th>Team</th>${table.map(t => `<th class="num cl-name" data-act="team:view" data-id="${esc(t.id)}" title="Open ${esc(t.name)}">${esc(t.name.slice(0,3).toUpperCase())}</th>`).join('')}</tr></thead>
    <tbody>${table.map(a => `<tr><td class="nowrap">${teamLink(teamById(a.id), 20)}</td>${
      table.map(b => {
        if (a.id === b.id) return `<td class="num muted">—</td>`;
        const h = headToHead(a.id, b.id);
        return `<td class="num" title="${h.aWins}W ${h.draws}D ${h.bWins}L">${h.aGoals}:${h.bGoals}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
  return html;
};

let playerSortKey = 'goals';
VIEWS.players = () => {
  const st = computePlayerStats();
  const q = (app._playerQuery || '').toLowerCase();

  const sorted = app.state.players.slice().filter(p =>
    !q || p.name.toLowerCase().includes(q) || (teamById(p.teamId).name || '').toLowerCase().includes(q)
  );
  sorted.sort((a,b) => {
    const sa = st[a.id] || {}, sb = st[b.id] || {};
    return (sb[playerSortKey] || 0) - (sa[playerSortKey] || 0);
  });

  const fmt = k => (k === 'playerValue' || k === 'marketValue' || k === 'growth') ? money : (v => v);

  let html = `<div class="view-head"><h2><span class="emoji float">🌟</span> Players</h2></div>
  <div class="card anim" style="margin-bottom:12px">
    <div class="field-row">
      <div><label class="fl">Search</label><input id="playerSearch" placeholder="Player or team..." value="${esc(app._playerQuery || '')}"></div>
      <div><label class="fl">Sort by</label>
        <select id="playerSort">
          ${[['goals','Goals'],['assists','Assists'],['saves','Saves'],['tackles','Tackles'],['playerValue','Player Value'],['marketValue','Market Value'],['mvp','MVP'],['motm','MOTM']]
            .map(([k,l]) => `<option value="${k}" ${playerSortKey === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>`;

  if (!sorted.length) return html + `<div class="empty"><span class="big">🔍</span>No players found.</div>`;

  html += `<div class="tblwrap"><table>
    <thead><tr>
      <th>#</th><th>Player</th><th>Team</th>
      <th class="num">${playerSortKey.toUpperCase()}</th>
      <th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th>
      <th class="num">MVP</th><th class="num">Value</th>
    </tr></thead><tbody>`;
  sorted.forEach((p, i) => {
    const s = st[p.id] || {};
    const tm = teamById(p.teamId);
    const fa = p.freeAgent ? ' <span class="pill go tiny">FA</span>' : '';
    html += `<tr class="${i < 3 ? 'top' + (i + 1) : ''}">
      <td><span class="rk ${i === 0 ? 'rank1' : i === 1 ? 'rank2' : i === 2 ? 'rank3' : 'rk-D'}">${i+1}</span></td>
      <td>${playerLink(p, 'var(--cyan)')}${fa}</td>
      <td>${teamLink(tm, 20)}</td>
      <td class="num" style="color:var(--gold);font-weight:900">${fmt(playerSortKey)(s[playerSortKey] || 0)}</td>
      <td class="num">${s.goals||0}</td><td class="num">${s.assists||0}</td>
      <td class="num">${s.saves||0}</td><td class="num">${s.tackles||0}</td>
      <td class="num">${s.mvp||0}</td>
      <td class="num" style="color:var(--lime)">${money(s.playerValue)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
};

VIEWS.teams = () => {
  const st = computePlayerStats();
  const standMap = computeStandings();
  const s = app.state;
  if (!s.teams.length) return `<div class="view-head"><h2><span class="emoji float">🛡️</span> Teams</h2></div><div class="empty"><span class="big">🛡️</span>No teams yet.</div>`;

  let html = `<div class="view-head"><h2><span class="emoji float">🛡️</span> Teams</h2></div><div class="grid g3">`;
  s.teams.forEach(t => {
    const roster = s.players.filter(p => p.teamId === t.id && isActivePlayer(p));
    const stt = standMap[t.id] || {};
    const avgVal = roster.length ? roster.reduce((a,p) => a + (st[p.id]?.playerValue||0), 0) / roster.length : 0;
    const top = roster.slice().sort((a,b) => (st[b.id]?.goals||0) - (st[a.id]?.goals||0))[0];

    html += `<div class="card clickable anim" data-act="team:view" data-id="${t.id}">
      <div class="row" style="margin-bottom:8px">${teamLogo(t, 44)}<b style="font-size:15px">${esc(t.name)}</b></div>
      <div class="kv"><span>Players</span><b>${roster.length}</b></div>
      <div class="kv"><span>Matches</span><b>${stt.mp||0}</b></div>
      <div class="kv"><span>Record</span><b>${stt.w||0}W ${stt.d||0}D ${stt.l||0}L</b></div>
      <div class="kv"><span>Points</span><b style="color:var(--gold)">${stt.pts||0}</b></div>
      <div class="kv"><span>Avg player value</span><b style="color:var(--lime)">${money(avgVal)}</b></div>
      <div class="kv"><span>Top scorer</span><b>${top ? playerLink(top) + ' (' + (st[top.id]?.goals||0) + ')' : '—'}</b></div>
      <div class="kv"><span>Treasury</span><b style="color:var(--gold)">${money(t.value)}</b></div>
    </div>`;
  });
  html += `</div>`;
  return html;
};

VIEWS.teamprofile = () => {
  const t = teamById(app._teamViewId);
  if (!t || !app.state.teams.find(x => x.id === t.id))
    return `<div class="empty"><span class="big">❓</span>Team not found. <button class="btn sm" data-act="goto" data-view="teams">Back</button></div>`;

  const st = computePlayerStats();
  const standMap = computeStandings();
  const stt = standMap[t.id] || { mp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,form:[],comebacks:0,wall:0,best:0 };
  const roster = app.state.players.filter(p => p.teamId === t.id && isActivePlayer(p));

  const former = app.state.players.filter(p => {
    if (p.teamId === t.id && isActivePlayer(p)) return false;
    if (p.teamId === t.id && p.freeAgent) return true;
    return (p.transferHistory || []).some(h => h.from === t.id && h.to && h.to !== t.id);
  });

  const avgVal = roster.length ? roster.reduce((a,p) => a + (st[p.id]?.playerValue||0), 0) / roster.length : 0;
  const myMatches = app.state.matches.filter(m => m.teamAId === t.id || m.teamBId === t.id)
    .sort((a,b) => (b.timestamp||0) - (a.timestamp||0)).slice(0, 8);

  let html = `<div class="view-head">
    <h2 style="display:flex;align-items:center;gap:12px">${teamLogo(t, 44)} ${esc(t.name)}</h2>
    <div class="head-actions">
      <button class="btn sm" data-act="goto" data-view="teams">← Teams</button>
      ${app.isAdmin ? `<button class="btn sm gold" data-act="team:addfunds" data-id="${t.id}">💵 Add funds</button>
      <button class="btn sm" data-act="team:edit" data-id="${t.id}">✏️ Edit</button>` : ''}
    </div>
  </div>`;

  html += `<div class="grid g4">
    <div class="statbox"><div class="v">${stt.mp}</div><div class="l">Matches</div></div>
    <div class="statbox"><div class="v">${pct(stt.w, stt.mp)}</div><div class="l">Win rate</div></div>
    <div class="statbox"><div class="v" style="color:${stt.gd>=0?'var(--lime)':'var(--red)'}">${stt.gd>0?'+':''}${stt.gd}</div><div class="l">Goal diff</div></div>
    <div class="statbox"><div class="v" style="color:var(--gold)">${stt.pts}</div><div class="l">Points</div></div>
    <div class="statbox"><div class="v">${roster.length}</div><div class="l">Players</div></div>
    <div class="statbox"><div class="v" style="color:var(--lime)">${money(avgVal)}</div><div class="l">Avg value</div></div>
    <div class="statbox"><div class="v" style="color:var(--gold)">${money(t.value)}</div><div class="l">Treasury</div></div>
    <div class="statbox"><div class="v">${stt.wall||0}</div><div class="l">Wall (T+S)</div></div>
  </div>`;

  html += `<div class="section-title">Award Progress</div><div class="card anim">
    <div class="kv"><span>🔥 Comeback wins</span><b>${stt.comebacks||0}</b></div>
    <div class="kv"><span>⚡ Best win streak</span><b>${stt.best||0}</b></div>
    <div class="kv"><span>🧱 Tackles + Saves</span><b>${stt.wall||0}</b></div>
    <div class="kv"><span>🎯 Goals for / against</span><b>${stt.gf} / ${stt.ga}</b></div>
    <div class="kv"><span>📈 Recent form</span><b>${(stt.form||[]).slice(-5).map(f=>`<span class="badge b-${f}">${f}</span>`).join(' ') || '—'}</b></div>
  </div>`;

  html += `<div class="section-title">Recent Matches</div><div class="grid g2">`;
  if (!myMatches.length) html += `<div class="empty"><span class="big">📭</span>No matches yet.</div>`;
  myMatches.forEach(m => {
    const isA = m.teamAId === t.id;
    const opp = teamById(isA ? m.teamBId : m.teamAId);
    const agg = matchAggregate(m);
    const my = isA ? agg.a : agg.b, their = isA ? agg.b : agg.a;
    const res = my > their ? 'W' : my < their ? 'L' : 'D';
    html += `<div class="card anim" style="padding:10px">
      <div class="between">
        <span class="badge b-${res}">${res}</span>
        <b>${my} - ${their}</b>
        <span class="muted small">vs ${teamLink(opp, 20)}</span>
        <button class="btn sm" data-act="match:view" data-id="${m.id}">📊</button>
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Full Roster</div><div class="tblwrap"><table>
    <thead><tr><th>Player</th><th class="num">MP</th><th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th>
    <th class="num">MVP</th><th class="num">MOTM</th><th class="num">Start</th><th class="num">Growth</th><th class="num">Value</th>${app.isAdmin ? '<th></th>' : ''}</tr></thead>
    <tbody>${roster.length ? roster.map(p => {
      const s = st[p.id] || {};
      return `<tr>
        <td>${playerLink(p, 'var(--cyan)')}</td>
        <td class="num">${s.matches||0}</td>
        <td class="num">${s.goals||0}</td><td class="num">${s.assists||0}</td>
        <td class="num">${s.saves||0}</td><td class="num">${s.tackles||0}</td>
        <td class="num">${s.mvp||0}</td><td class="num">${s.motm||0}</td>
        <td class="num">${money(s.startingValue)}</td>
        <td class="num" style="color:var(--lime)">+${money(s.growth)}</td>
        <td class="num" style="color:var(--gold);font-weight:900">${money(s.playerValue)}</td>
        ${app.isAdmin ? `<td class="nowrap">
          <button class="btn sm" data-act="player:edit" data-id="${p.id}" title="Edit">✏️</button>
          <button class="btn sm lime" data-act="player:release" data-id="${p.id}" title="Release as free agent">🟡</button>
        </td>` : ''}
      </tr>`;
    }).join('') : `<tr><td colspan="${app.isAdmin ? 12 : 11}" class="center muted" style="padding:16px">No players</td></tr>`}</tbody>
  </table></div>`;

  if (former.length){
    html += `<div class="section-title">Former &amp; Free Agents</div><div class="card anim">
      ${former.map(p => {
        const s = st[p.id] || {};
        const status = p.freeAgent ? '<span class="pill go">🟡 FREE AGENT</span>' : '<span class="pill cy">MOVED</span>';
        const moved = (p.transferHistory || []).filter(h => h.from === t.id && h.to && h.to !== t.id).slice(-1)[0];
        const dest = moved ? ' · to ' + esc(teamById(moved.to).name) : '';
        return `<div class="kv">
          <span>${playerLink(p)} ${status}</span>
          <b class="small muted">${s.goals||0}G ${s.assists||0}A ${s.saves||0}S ${s.tackles||0}T · ${money(s.playerValue)}${dest}</b>
        </div>`;
      }).join('')}
    </div>`;
  }

  return html;
};

VIEWS.tournament = () => {
  const s = app.state;
  if (app._tourViewId){
    const t = tourById(app._tourViewId);
    if (t) return tournamentDetail(t);
  }

  let html = `<div class="view-head">
    <h2><span class="emoji float">🥇</span> Tournaments</h2>
    <div class="head-actions">${app.isAdmin ? `<button class="btn magenta" data-act="tournament:create"><span class="emoji">➕</span> Create</button>` : ''}</div>
  </div>`;

  if (!s.tournaments.length) return html + `<div class="empty"><span class="big">🏆</span>No tournaments yet.</div>`;

  html += `<div class="grid g2">`;
  s.tournaments.forEach(t => {
    const winner = t.winner ? teamById(t.winner) : null;
    html += `<div class="card clickable anim" data-act="tournament:view" data-id="${t.id}">
      <div class="between">
        <b style="font-size:15px">🏆 ${esc(t.name)}</b>
        <span class="pill ${t.completed ? 'li' : 'cy'}">${t.completed ? 'COMPLETED' : t.phase.toUpperCase()}</span>
      </div>
      <div class="kv"><span>Teams</span><b>${t.teams.length}</b></div>
      <div class="kv"><span>Groups</span><b>${t.groups.length}</b></div>
      <div class="kv"><span>Knockout legs</span><b>${t.koLegs}</b></div>
      ${winner ? `<div class="kv"><span>🏆 Winner</span><b style="color:var(--gold)">${esc(winner.name)}</b></div>` : ''}
    </div>`;
  });
  html += `</div>`;
  return html;
};

function tournamentDetail(t){
  let html = `<div class="view-head">
    <h2><span class="emoji float">🏆</span> ${esc(t.name)}</h2>
    <div class="head-actions">

function teamOfTheSeason(){
  const st = computePlayerStats();
  const pool = app.state.players.map(p => ({ p, s: st[p.id] || {} }));
  const pick = keys => {
    let best = null;
    pool.forEach(x => {
      if (!best){ best = x; return; }
      for (let i = 0; i < keys.length; i++){
        const d = (+x.s[keys[i]] || 0) - (+best.s[keys[i]] || 0);
        if (d > 0){ best = x; return; }
        if (d < 0) return;
      }
    });
    return (best && (+best.s[keys[0]] || 0) > 0) ? best : null;
  };
  return [
    { slot:'ST',  icon:'⚽', role:'Striker',    key:'goals',   unit:'Goals',   row: pick(['goals','assists','tackles','saves']) },
    { slot:'CAM', icon:'🎯', role:'Playmaker',  key:'assists', unit:'Assists', row: pick(['assists','goals','tackles','saves']) },
    { slot:'CB',  icon:'🛡️', role:'Defender',   key:'tackles', unit:'Tackles', row: pick(['tackles','saves','goals','assists']) },
    { slot:'GK',  icon:'🧤', role:'Goalkeeper', key:'saves',   unit:'Saves',   row: pick(['saves','tackles','goals','assists']) }
  ];
}
