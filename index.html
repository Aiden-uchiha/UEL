function parsePlayerLines(text){ return String(text || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean); }

const RP_SCORE  = /^(.+?)\s+(\d+)\s*[-–—:]\s*(\d+)\s+(.+)$/;
const RP_VS     = /^(.+?)\s+(?:vs\.?|versus|v)\s+(.+)$/i;
const RP_LEG_A  = /^(?:leg|round)\s*(\d+)\s*[:.]?\s*(?:(\d+)\s*[-–—:]\s*(\d+))?$/i;
const RP_LEG_B  = /^(\d+)(?:st|nd|rd|th)?\s*leg\s*[:.]?\s*(?:(\d+)\s*[-–—:]\s*(\d+))?$/i;
const RP_TOKENS = /^(.+?)\s+((?:\d+\s*[gastf]\s*)+)$/i;
const RP_BARE   = /^(.+?)\s+(\d+)\s+(\d+)(?:\s+(\d+))?(?:\s+(\d+))?$/;
const RP_AWARD  = /^(mvp|motm)\s*:?\s*(.+)$/i;

function rpNorm(s){
  let out = String(s || '');
  if (out.normalize) out = out.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  return out.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, ' ').trim().replace(/\s+/g, ' ');
}

function rpDistance(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = [];
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  return prev[n];
}

function rpScore(query, candidate){
  if (!query || !candidate) return -1;
  if (query === candidate) return 100;
  if (candidate.indexOf(query) === 0 || query.indexOf(candidate) === 0) return 80 - Math.abs(candidate.length - query.length);
  if (query.length >= 3 && candidate.indexOf(query) > -1) return 60;
  const d = rpDistance(query, candidate);
  const max = Math.max(1, Math.floor(Math.max(query.length, candidate.length) / 4));
  return d <= max ? 50 - d : -1;
}

function rpMatchPlayer(players, typed){
  const q = rpNorm(typed);
  if (!q) return null;
  let best = null, bestScore = -1, tie = false;
  players.forEach(p => {
    const keys = [rpNorm(p.name)].concat((p.aliases || []).map(rpNorm));
    keys.forEach(k => {
      const sc = rpScore(q, k);
      if (sc > bestScore){ bestScore = sc; best = p; tie = false; }
      else if (sc === bestScore && sc > 0 && p !== best){ tie = true; }
    });
  });
  return (best && bestScore > 0 && !tie) ? best : null;
}

function rpMatchTeam(name){
  const q = rpNorm(name);
  if (!q) return null;
  let best = null, bestScore = -1;
  app.state.teams.forEach(t => {
    const keys = [rpNorm(t.name)].concat((t.aliases || []).map(rpNorm));
    keys.forEach(k => {
      const sc = rpScore(q, k);
      if (sc > bestScore){ bestScore = sc; best = t; }
    });
  });
  return bestScore > 0 ? best : null;
}

function rpFindTeam(name){ return rpMatchTeam(name); }
function rpFindPlayer(teamIds, name){
  const pool = app.state.players.filter(p => teamIds.indexOf(p.teamId) > -1);
  return rpMatchPlayer(pool, name) || rpMatchPlayer(app.state.players, name);
}

function rpNewMatch(round, aName, bName){
  return { round, teamAName: aName, teamBName: bName, legs: [], curLeg: 0, mvpName: '', motmName: '', warnings: [] };
}
function rpEnsureLeg(m, idx){
  idx = Math.max(0, Math.min(3, idx));
  while (m.legs.length <= idx) m.legs.push({ a: null, b: null, given: false, players: [] });
  m.curLeg = idx;
  return m.legs[idx];
}
function rpDeriveLeg(m, leg){
  let a = 0, b = 0;
  leg.players.forEach(p => {
    if (!p.player) return;
    if (m.teamA && p.player.teamId === m.teamA.id) a += p.goals || 0;
    else if (m.teamB && p.player.teamId === m.teamB.id) b += p.goals || 0;
  });
  leg.a = a; leg.b = b;
}
function rpDeriveAgg(m){
  m.aggA = m.legs.reduce((n, l) => n + (l.a || 0), 0);
  m.aggB = m.legs.reduce((n, l) => n + (l.b || 0), 0);
}

function parseReportText(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/[*_`]/g, '').trim());
  const matches = [];
  let round = '', cur = null;

  for (const line of lines){
    if (!line) continue;

    const aw = line.match(RP_AWARD);
    if (aw && cur){
      if (aw[1].toLowerCase() === 'mvp') cur.mvpName = aw[2].trim();
      else cur.motmName = aw[2].trim();
      continue;
    }

    const lg = line.match(RP_LEG_A) || line.match(RP_LEG_B);
    if (lg && cur){
      const leg = rpEnsureLeg(cur, Number(lg[1]) - 1);
      if (lg[2] !== undefined && lg[2] !== null){
        leg.a = Number(lg[2]); leg.b = Number(lg[3]); leg.given = true;
      }
      continue;
    }

    const sc = line.match(RP_SCORE);
    if (sc){
      const aName = sc[1].trim(), bName = sc[4].trim();
      const samePair = cur && cur.legs.length === 0 &&
        rpNorm(cur.teamAName) === rpNorm(aName) && rpNorm(cur.teamBName) === rpNorm(bName);
      if (!samePair){ cur = rpNewMatch(round, aName, bName); matches.push(cur); }
      const leg = rpEnsureLeg(cur, 0);
      leg.a = Number(sc[2]); leg.b = Number(sc[3]); leg.given = true;
      continue;
    }

    const vs = line.match(RP_VS);
    if (vs){ cur = rpNewMatch(round, vs[1].trim(), vs[2].trim()); matches.push(cur); continue; }

    const tk = line.match(RP_TOKENS);
    if (tk && cur){
      const st = { name: tk[1].trim(), goals: 0, assists: 0, saves: 0, tackles: 0, fouls: 0 };
      const re = /(\d+)\s*([gastf])/gi;
      let hit;
      while ((hit = re.exec(tk[2]))){
        const v = Number(hit[1]); const k = hit[2].toLowerCase();
        if (k === 'g') st.goals += v; else if (k === 'a') st.assists += v;
        else if (k === 's') st.saves += v; else if (k === 'f') st.fouls += v;
        else st.tackles += v;
      }
      rpEnsureLeg(cur, cur.curLeg).players.push(st);
      continue;
    }

    const br = line.match(RP_BARE);
    if (br && cur){
      rpEnsureLeg(cur, cur.curLeg).players.push({
        name: br[1].trim(), goals: Number(br[2]) || 0, assists: Number(br[3]) || 0,
        saves: Number(br[4]) || 0, tackles: Number(br[5]) || 0
      });
      continue;
    }

    if (!cur){ round = line; continue; }
    cur.warnings.push('Ignored: "' + line.slice(0, 50) + '"');
  }

  matches.forEach((m, mi) => {
    m.index = mi;
    m.teamA = rpFindTeam(m.teamAName);
    m.teamB = rpFindTeam(m.teamBName);
    if (!m.teamA) m.warnings.push('Unknown team: ' + m.teamAName);
    if (!m.teamB) m.warnings.push('Unknown team: ' + m.teamBName);
    m.teamIds = [m.teamA && m.teamA.id, m.teamB && m.teamB.id].filter(Boolean);
    if (!m.legs.length) rpEnsureLeg(m, 0);
    m.legs.forEach((leg, li) => {
      leg.index = li;
      leg.players.forEach((p, pi) => {
        p.index = pi; p.leg = li;
        if (!p.manual) p.player = rpFindPlayer(m.teamIds, p.name);
        if (!p.player) m.warnings.push('Unknown player: ' + p.name);
      });
      if (!leg.given) rpDeriveLeg(m, leg);
    });
    rpDeriveAgg(m);
    m.players = [];
    m.legs.forEach(l => l.players.forEach(p => m.players.push(p)));
  });

  return { matches };
}

function importReportMatches(parsed){
  const created = [];
  parsed.matches.forEach((pm, idx) => {
    if (!pm.teamA || !pm.teamB || pm.teamA.id === pm.teamB.id) return;
    if (!pm.legs.length) return;

    let f = app.state.fixtures.find(x => !x.played && !x.tournamentId &&
      ((x.teamAId === pm.teamA.id && x.teamBId === pm.teamB.id) ||
       (x.teamAId === pm.teamB.id && x.teamBId === pm.teamA.id)));

    if (!f){
      f = {
        id: uuid(), teamAId: pm.teamA.id, teamBId: pm.teamB.id,
        competition: 'League', round: pm.round || 'Imported',
        date: '', legs: pm.legs.length, played: false, stage: 'friendly', tournamentId: null, group: null
      };
      app.state.fixtures.push(f);
    }
    f.legs = pm.legs.length;

    const blank = () => ({ played: false, goals: 0, assists: 0, saves: 0, tackles: 0, fouls: 0 });
    const stats = {};
    pm.legs.forEach((leg, li) => {
      leg.players.forEach(p => {
        if (!p.player) return;
        const id = p.player.id;
        if (!stats[id]) stats[id] = pm.legs.map(blank);
        const slot = stats[id][li];
        slot.played = true;
        slot.goals += p.goals || 0;
        slot.assists += p.assists || 0;
        slot.saves += p.saves || 0;
        slot.tackles += p.tackles || 0;
        slot.fouls += p.fouls || 0;

        const norm = rpNorm(p.name);
        const known = [rpNorm(p.player.name)].concat((p.player.aliases || []).map(rpNorm));
        if (norm && known.indexOf(norm) === -1){
          p.player.aliases = (p.player.aliases || []).filter(a => rpNorm(a) !== norm).slice(-9).concat(p.name);
        }
      });
    });

    const contrib = pid => stats[pid].reduce((n, l) => n + l.goals * 5 + l.assists * 3 + l.saves + l.tackles * 0.5, 0);
    const ranked = Object.keys(stats).map(pid => ({ pid, v: contrib(pid) })).sort((a, b) => b.v - a.v);

    const byName = name => name ? rpFindPlayer([pm.teamA.id, pm.teamB.id], name) : null;
    const mvpP = byName(pm.mvpName) || (ranked[0] && playerById(ranked[0].pid)) || null;
    const motmP = byName(pm.motmName) || (ranked[1] && playerById(ranked[1].pid)) || mvpP;

    const m = {
      id: uuid(),
      teamAId: pm.teamA.id, teamBId: pm.teamB.id, fixtureId: f.id,
      timestamp: Date.now() + idx,
      mvpId: mvpP ? mvpP.id : null, motmId: motmP ? motmP.id : null,
      mvpSnapshot: mvpP ? { name: mvpP.name, teamId: mvpP.teamId } : null,
      motmSnapshot: motmP ? { name: motmP.name, teamId: motmP.teamId } : null,
      playerStats: stats, playerTeams: {}
    };

    Object.keys(stats).forEach(pid => {
      const p = playerById(pid);
      if (p) m.playerTeams[pid] = p.teamId;
    });

    for (let i = 1; i <= 4; i++){
      if (i <= pm.legs.length){ m['leg' + i + 'ScoreA'] = pm.legs[i - 1].a; m['leg' + i + 'ScoreB'] = pm.legs[i - 1].b; }
      else { m['leg' + i + 'ScoreA'] = null; m['leg' + i + 'ScoreB'] = null; }
    }

    applyMatchToState(m, f);
    created.push(m);
  });
  return created;
}

function renderReportPreview(parsed){
  const box = $('#reportPreview');
  if (!box) return;
  const text = ($('#reportText') || {}).value || '';
  if (!parsed || app._reportText !== text){ parsed = parseReportText(text); app._reportText = text; }
  app._report = parsed;

  if (!parsed.matches.length){ box.innerHTML = `<div class="empty" style="padding:14px">Nothing recognised yet.</div>`; return; }

  let h = `<div class="tiny muted" style="margin-bottom:8px">${parsed.matches.length} match${parsed.matches.length === 1 ? '' : 'es'} recognised</div>`;

  parsed.matches.forEach(m => {
    const tA = m.teamA ? esc(m.teamA.name) : `<span style="color:var(--red)">${esc(m.teamAName)}?</span>`;
    const tB = m.teamB ? esc(m.teamB.name) : `<span style="color:var(--red)">${esc(m.teamBName)}?</span>`;
    const missing = m.players.filter(p => !p.player).length;
    const pool = app.state.players.filter(x => m.teamIds.indexOf(x.teamId) > -1);

    h += `<div class="rp-match">
      <div class="between">
        <b>${tA} <span style="color:var(--cyan)">${m.aggA} - ${m.aggB}</span> ${tB}</b>
        <span class="pill ${missing || m.warnings.length ? 'mg' : 'li'}">${m.legs.length} leg${m.legs.length > 1 ? 's' : ''}</span>
      </div>`;
    m.legs.forEach(leg => {
      const miss = leg.players.filter(p => !p.player);
      h += `<div style="margin-top:8px">
        <div class="tiny" style="color:var(--gold);letter-spacing:1.2px">LEG ${leg.index + 1} <span style="color:var(--cyan)">${leg.a} - ${leg.b}</span></div>
        ${leg.players.filter(p => p.player).length ? `<div class="row" style="gap:5px;margin-top:5px">${leg.players.filter(p => p.player).map(p => {
          const differs = rpNorm(p.player.name) !== rpNorm(p.name);
          return `<span class="pill cy" title="${esc(p.player.name)}">${esc(p.name)}${differs ? ' → ' + esc(p.player.name) : ''} ${p.goals}G ${p.assists}A ${p.saves}S ${p.tackles}T</span>`;
        }).join('')}</div>` : ''}
        ${miss.length ? `<div style="margin-top:5px">${miss.map(p => `
          <div class="row" style="gap:6px;margin-top:4px">
            <span class="pill go">${esc(p.name)}</span>
            <span class="tiny muted">not found, pick:</span>
            <select data-rp-fix="${m.index}:${leg.index}:${p.index}" style="width:auto;flex:1;max-width:240px;padding:4px 6px;font-size:11px">
              <option value="">skip this player</option>
              ${pool.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
            </select>
          </div>`).join('')}</div>` : ''}
      </div>`;
    });
    h += `${m.warnings.length ? `<div class="tiny" style="color:var(--gold);margin-top:7px">${m.warnings.map(esc).join(' • ')}</div>` : ''}</div>`;
  });

  box.innerHTML = h;
}

function trackStart(fixtureId){
  const f = fixtureById(fixtureId);
  if (!f) return;
  const legs = Math.max(1, Math.min(4, Number(f.legs) || 1));
  const st = {
    fixtureId: f.id, legs, leg: 1,
    scores: Array.from({ length: legs }, () => ({ a: 0, b: 0 })),
    touched: Array.from({ length: legs }, () => false),
    sel: {}, mvpId: '', motmId: '', stats: {}
  };
  app.state.players
    .filter(p => (p.teamId === f.teamAId || p.teamId === f.teamBId) && isActivePlayer(p))
    .forEach(p => {
      st.stats[p.id] = Array.from({ length: legs }, () => ({ g: 0, a: 0, s: 0, t: 0, f: 0 }));
    });
  app._track = st;
  app._trackUndo = [];
  openModal('⚡ Match Tracker', trackBodyHTML(),
    `<button class="btn" data-act="track:undo">↩️ Undo</button>
     <button class="btn" data-act="track:reset">🧹 Reset leg</button>
     <button class="btn" data-act="track:copy">📋 Copy</button>
     <button class="btn lime" data-act="track:save">💾 Save match</button>`);
  renderTrack();
}

function trackTotals(){
  const st = app._track;
  const out = { a: 0, b: 0 };
  if (!st) return out;
  st.scores.forEach(s => { out.a += s.a; out.b += s.b; });
  return out;
}

function trackBodyHTML(){
  const st = app._track;
  if (!st) return '';
  const f = fixtureById(st.fixtureId);
  if (!f) return '<div class="empty">Fixture not found</div>';
  const A = teamById(f.teamAId), B = teamById(f.teamBId);
  const i = st.leg - 1;
  const sc = st.scores[i];
  const all = trackTotals();

  const row = p => {
    const s = st.stats[p.id] && st.stats[p.id][i] || { g:0, a:0, s:0, t:0, f:0 };
    const picked = !!(st.sel && st.sel[p.id]);
    const chip = (k, icon, label) =>
      `<button class="trk-chip ${s[k] ? 'on' : ''} ${picked ? '' : 'off'}" data-act="track:inc" data-pid="${p.id}" data-k="${k}" title="${label}">${icon} ${s[k]}</button>`;
    return `<div class="trk-row">
      <label class="trk-play" title="Tick him if he played"><input type="checkbox" data-trk-play="${p.id}" ${picked ? 'checked' : ''}></label>
      <span class="trk-name ${picked ? '' : 'out'}">${esc(p.name)}</span>
      ${chip('g', '⚽', 'Goal')}${chip('a', '🅰️', 'Assist')}${chip('s', '🧤', 'Save')}${chip('t', '🛡️', 'Tackle')}${chip('f', '🚫', 'Foul')}
    </div>`;
  };

  const side = team => {
    const roster = app.state.players.filter(p => p.teamId === team.id && isActivePlayer(p));
    return `<div class="trk-team">
      <div class="trk-team-head">
        ${teamLogo(team, 24)}<b>${esc(team.name)}</b>
        <button class="trk-mini" data-act="track:all" data-team="${team.id}" data-mode="all">all</button>
        <button class="trk-mini" data-act="track:all" data-team="${team.id}" data-mode="none">none</button>
      </div>
      ${roster.length ? roster.map(row).join('') : '<div class="muted small">No players in this team</div>'}
    </div>`;
  };

  const pool = app.state.players.filter(p => (p.teamId === f.teamAId || p.teamId === f.teamBId) && isActivePlayer(p) && st.sel[p.id]);
  const awardOpts = sel => `<option value="">auto</option>` + pool.map(p =>
    `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

  return `<div class="trk-score">
    <span class="trk-side">${teamLogo(A, 34)}<b>${esc(A.name)}</b></span>
    <span class="trk-num">${sc.a} - ${sc.b}</span>
    <span class="trk-side">${teamLogo(B, 34)}<b>${esc(B.name)}</b></span>
  </div>
  ${st.legs > 1 ? `<div class="center tiny muted" style="margin-bottom:8px">Aggregate ${all.a} - ${all.b}</div>
  <div class="legtab" style="justify-content:center">${Array.from({ length: st.legs }, (_, n) =>
    `<button class="${st.leg === n + 1 ? 'on' : ''}" data-act="track:leg" data-leg="${n + 1}">Leg ${n + 1}</button>`).join('')}</div>` : ''}
  <div class="trk-cols">${side(A)}${side(B)}</div>
  <div class="field-row" style="margin-top:12px">
    <div><label class="fl">🏅 MVP</label><select data-trk-award="mvp" style="padding:6px 8px;font-size:12px">${awardOpts(st.mvpId)}</select></div>
    <div><label class="fl">⭐ MOTM</label><select data-trk-award="motm" style="padding:6px 8px;font-size:12px">${awardOpts(st.motmId)}</select></div>
  </div>
  <div class="tiny muted" style="margin-top:10px;text-align:center">Tick players who played, or just tap a stat and he ticks himself. Undo takes back the last tap.</div>`;
}

function renderTrack(){
  const body = $('#modalBody');
  if (!body) return;
  const top = body.scrollTop;
  body.innerHTML = trackBodyHTML();
  body.scrollTop = top;
}

function trackIncrement(pid, k){
  const st = app._track;
  if (!st || !st.stats[pid]) return;
  st.sel[pid] = true;
  const i = st.leg - 1;
  st.touched[i] = true;
  const l = st.stats[pid][i];
  l[k] = (l[k] || 0) + 1;
  const p = playerById(pid);
  const f = fixtureById(st.fixtureId);
  if (k === 'g' && p && f){
    if (p.teamId === f.teamAId) st.scores[i].a++;
    else if (p.teamId === f.teamBId) st.scores[i].b++;
  }
  app._trackUndo = (app._trackUndo || []).concat([{ pid, k, leg: st.leg }]);
  renderTrack();
}

function trackUndo(){
  const undo = app._trackUndo || [];
  const last = undo.pop();
  app._trackUndo = undo;
  if (!last) return;
  const st = app._track;
  const l = st.stats[last.pid] && st.stats[last.pid][last.leg - 1];
  if (!l) return;
  l[last.k] = Math.max(0, (l[last.k] || 0) - 1);
  const p = playerById(last.pid);
  const f = fixtureById(st.fixtureId);
  if (last.k === 'g' && p && f){
    const i = last.leg - 1;
    if (p.teamId === f.teamAId) st.scores[i].a = Math.max(0, st.scores[i].a - 1);
    else st.scores[i].b = Math.max(0, st.scores[i].b - 1);
  }
  renderTrack();
}

function trackResetLeg(){
  const st = app._track;
  if (!st) return;
  const i = st.leg - 1;
  Object.keys(st.stats).forEach(pid => { st.stats[pid][i] = { g:0, a:0, s:0, t:0, f:0 }; });
  st.scores[i] = { a: 0, b: 0 };
  st.touched[i] = false;
  app._trackUndo = (app._trackUndo || []).filter(u => u.leg !== st.leg);
  renderTrack();
}

function trackSetSelected(pid, picked){
  const st = app._track;
  if (!st) return;
  st.sel = st.sel || {};
  if (picked){
    st.sel[pid] = true;
  } else {
    delete st.sel[pid];
    if (st.stats[pid]) st.stats[pid] = st.stats[pid].map(() => ({ g:0, a:0, s:0, t:0, f:0 }));
    app._trackUndo = (app._trackUndo || []).filter(u => u.pid !== pid);
    if (st.mvpId === pid) st.mvpId = '';
    if (st.motmId === pid) st.motmId = '';
    trackRecomputeScores();
  }
  renderTrack();
}

function trackSelectTeam(teamId, mode){
  const st = app._track;
  if (!st) return;
  const roster = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  if (mode === 'all'){
    roster.forEach(p => { st.sel[p.id] = true; });
  } else {
    roster.forEach(p => {
      delete st.sel[p.id];
      if (st.stats[p.id]) st.stats[p.id] = st.stats[p.id].map(() => ({ g:0, a:0, s:0, t:0, f:0 }));
      if (st.mvpId === p.id) st.mvpId = '';
      if (st.motmId === p.id) st.motmId = '';
    });
    app._trackUndo = (app._trackUndo || []).filter(u => !roster.some(p => p.id === u.pid));
    trackRecomputeScores();
  }
  renderTrack();
}

function trackRecomputeScores(){
  const st = app._track;
  if (!st) return;
  const f = fixtureById(st.fixtureId);
  if (!f) return;
  st.scores = st.scores.map(() => ({ a: 0, b: 0 }));
  Object.keys(st.stats).forEach(pid => {
    const p = playerById(pid);
    if (!p) return;
    st.stats[pid].forEach((l, li) => {
      if (!st.scores[li]) return;
      if (p.teamId === f.teamAId) st.scores[li].a += l.g || 0;
      else if (p.teamId === f.teamBId) st.scores[li].b += l.g || 0;
    });
  });
}

function trackResultText(){
  const st = app._track;
  if (!st) return '';
  const f = fixtureById(st.fixtureId);
  const A = teamById(f.teamAId), B = teamById(f.teamBId);
  const all = trackTotals();
  const lines = [`${A.name} ${all.a} - ${all.b} ${B.name}`];
  Object.keys(st.stats).forEach(pid => {
    const p = playerById(pid);
    if (!p) return;
    if (!st.sel || !st.sel[pid]) return;
    const t = st.stats[pid].reduce((n, l) => ({
      g: n.g + l.g, a: n.a + l.a, s: n.s + l.s, k: n.k + l.t, f: n.f + (l.f || 0)
    }), { g:0, a:0, s:0, k:0, f:0 });
    if (t.g || t.a || t.s || t.k || t.f) lines.push(`${p.name} ${t.g}G ${t.a}A ${t.s}S ${t.k}T ${t.f}F`);
  });
  return lines.join('\n');
}

function trackCopy(){
  const text = trackResultText();
  if (!text) return;
  const done = () => toast('📋 Result copied', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => trackCopyFallback(text, done));
  } else trackCopyFallback(text, done);
}

function trackCopyFallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('❌ Could not copy', 'err'); }
  ta.remove();
}

async function trackSave(){
  const st = app._track;
  if (!st) return;
  const f = fixtureById(st.fixtureId);
  if (!f){ closeModal(); return; }

  const touched = st.touched || [];
  let usedLegs = 1;
  touched.forEach((t, i) => { if (t) usedLegs = Math.max(usedLegs, i + 1); });
  usedLegs = Math.max(1, Math.min(st.legs, usedLegs));

  if (!Object.keys(st.sel || {}).length){
    return toast('⚠️ Tick at least one player first', 'err');
  }

  const stats = {};
  Object.keys(st.stats).forEach(pid => {
    const picked = !!(st.sel && st.sel[pid]);
    stats[pid] = st.stats[pid].slice(0, usedLegs).map(l => ({
      played: picked, goals: l.g || 0, assists: l.a || 0, saves: l.s || 0, tackles: l.t || 0, fouls: l.f || 0
    }));
  });

  const contrib = pid => stats[pid].reduce((n, l) =>
    n + l.goals * 5 + l.assists * 3 + l.saves + l.tackles * 0.5, 0);
  const ranked = Object.keys(stats).map(pid => ({ pid, v: contrib(pid) })).sort((a, b) => b.v - a.v);
  const autoMvp = ranked[0] && ranked[0].v > 0 ? ranked[0].pid : null;
  const autoMotm = ranked[1] && ranked[1].v > 0 ? ranked[1].pid : autoMvp;
  const mvpId = st.mvpId || autoMvp;
  const motmId = st.motmId || autoMotm;

  const m = {
    id: uuid(),
    teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id,
    timestamp: Date.now(),
    mvpId, motmId,
    mvpSnapshot: mvpId ? (() => { const p = playerById(mvpId); return p ? { name: p.name, teamId: p.teamId } : null; })() : null,
    motmSnapshot: motmId ? (() => { const p = playerById(motmId); return p ? { name: p.name, teamId: p.teamId } : null; })() : null,
    playerStats: stats, playerTeams: {}
  };

  Object.keys(stats).forEach(pid => {
    const p = playerById(pid);
    if (p) m.playerTeams[pid] = p.teamId;
  });

  for (let i = 1; i <= 4; i++){
    if (i <= usedLegs){
      m['leg' + i + 'ScoreA'] = st.scores[i - 1].a;
      m['leg' + i + 'ScoreB'] = st.scores[i - 1].b;
    } else { m['leg' + i + 'ScoreA'] = null; m['leg' + i + 'ScoreB'] = null; }
  }

  f.legs = usedLegs;
  applyMatchToState(m, f);
  app._track = null;
  app._trackUndo = [];
  await logAdmin('Tracked a match result');
  await saveState(); closeModal(); render();
  toast('✅ Match saved', 'ok');
}

function buildMatchDraft(fixture, existingMatch){
  let maxLeg = fixture.legs || 1;
  if (existingMatch) {
    for(let i=4; i>=1; i--) {
      if (existingMatch['leg'+i+'ScoreA'] !== null && existingMatch['leg'+i+'ScoreA'] !== undefined) {
        maxLeg = Math.max(maxLeg, i); break;
      }
    }
  }
  const legs = maxLeg;

  /* Build stats for all current players + players who have stats in the existing match */
  const stats = {};
  const currentPlayers = app.state.players.filter(p => (p.teamId === fixture.teamAId || p.teamId === fixture.teamBId) && !p.freeAgent);
  currentPlayers.forEach(p => {
    stats[p.id] = [];
    for (let i = 0; i < 4; i++) stats[p.id].push({ played:false, goals:0, assists:0, saves:0, tackles:0, fouls:0 });
  });

  /* Snapshot of who played for which team (preserved from old match if editing) */
  const playerTeams = existingMatch && existingMatch.playerTeams ? { ...existingMatch.playerTeams } : {};
  currentPlayers.forEach(p => { if (!playerTeams[p.id]) playerTeams[p.id] = p.teamId; });

  /* Copy over existing stats including transferred players */
  if (existingMatch && existingMatch.playerStats){
    Object.keys(existingMatch.playerStats).forEach(pid => {
      const p = playerById(pid);
      if (!p) return;
      if (!stats[pid]) stats[pid] = [{played:false,goals:0,assists:0,saves:0,tackles:0,fouls:0},{played:false,goals:0,assists:0,saves:0,tackles:0,fouls:0},{played:false,goals:0,assists:0,saves:0,tackles:0,fouls:0},{played:false,goals:0,assists:0,saves:0,tackles:0,fouls:0}];
      const src = existingMatch.playerStats[pid] || [];
      for (let i = 0; i < 4; i++){
        if (src[i]) stats[pid][i] = Object.assign({played:false,goals:0,assists:0,saves:0,tackles:0,fouls:0}, src[i]);
      }
      if (!playerTeams[pid] && p.teamId) playerTeams[pid] = p.teamId;
    });
  }

  const draft = {
    fixtureId: fixture.id,
    matchId: existingMatch ? existingMatch.id : null,
    leg: 1, legs,
    scores: [],
    mvpId: existingMatch ? existingMatch.mvpId : '',
    motmId: existingMatch ? existingMatch.motmId : '',
    stats, playerTeams
  };

  for (let i = 0; i < 4; i++){
    draft.scores.push({
      a: (existingMatch && existingMatch['leg'+(i+1)+'ScoreA'] !== null && existingMatch['leg'+(i+1)+'ScoreA'] !== undefined) ? existingMatch['leg'+(i+1)+'ScoreA'] : '',
      b: (existingMatch && existingMatch['leg'+(i+1)+'ScoreB'] !== null && existingMatch['leg'+(i+1)+'ScoreB'] !== undefined) ? existingMatch['leg'+(i+1)+'ScoreB'] : ''
    });
  }
  return draft;
}

function matchFormBody(){
  const d = app._draft;
  const f = fixtureById(d.fixtureId);
  const A = teamById(f.teamAId), B = teamById(f.teamBId);
  const leg = d.leg;

  let html = `<div class="row" style="margin-bottom:6px">
    ${teamTag(A, 24)}<span class="muted">vs</span>${teamTag(B, 24)}
    <span class="pill cy">${f.legs} leg${f.legs>1?'s':''}</span>
    ${f.round ? `<span class="pill">${esc(f.round)}</span>` : ''}
  </div>`;

  html += `<div class="section-title" style="margin-top:10px">Leg Scores</div>
  <div class="scroll-x"><table style="min-width:400px"><thead><tr><th>Leg</th><th>${teamTag(A, 20)}</th><th></th><th>${teamTag(B, 20)}</th></tr></thead><tbody>`;
  for (let i = 0; i < d.legs; i++){
    html += `<tr>
      <td><b>Leg ${i+1}</b></td>
      <td><input type="number" min="0" data-mfield="score" data-leg="${i}" data-side="a" value="${d.scores[i].a}" style="width:80px"></td>
      <td class="center muted">-</td>
      <td><input type="number" min="0" data-mfield="score" data-leg="${i}" data-side="b" value="${d.scores[i].b}" style="width:80px"></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="section-title" style="margin-top:16px">Player Stats — Leg ${leg}</div>
  <div class="legtab">${Array.from({length:d.legs},(_,i) =>
    `<button class="${d.leg===i+1?'on':''}" data-act="matchleg" data-leg="${i+1}">Leg ${i+1}</button>`).join('')}</div>`;

  const renderTeam = tid => {
    const tm = teamById(tid);
    /* Use snapshot team so transferred players still show for their original team */
    const roster = Object.keys(d.stats)
      .map(pid => playerById(pid))
      .filter(p => p && (d.playerTeams[p.id] || p.teamId) === tid);
    if (!roster.length) return `<div class="empty">No players for ${esc(tm.name)}</div>`;
    return `<div class="scroll-x"><table style="min-width:520px">
      <thead><tr><th>${teamTag(tm, 20)}</th><th class="center">Played</th><th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th><th class="num">F</th></tr></thead>
      <tbody>${roster.map(p => {
        const s = d.stats[p.id] ? d.stats[p.id][leg-1] : {played:false,goals:0,assists:0,saves:0,tackles:0,fouls:0};
        const moved = p.teamId !== (d.playerTeams[p.id] || p.teamId) ? ' <span class="pill cy tiny" title="Player has since transferred">MOVED</span>' : '';
        return `<tr>
          <td>${esc(p.name)}${moved}</td>
          <td class="center"><input type="checkbox" data-mfield="played" data-pid="${p.id}" data-leg="${leg-1}" ${s.played?'checked':''}></td>
          <td class="num"><input type="number" min="0" style="width:60px" data-mfield="stat" data-pid="${p.id}" data-leg="${leg-1}" data-k="goals" value="${s.goals}"></td>
          <td class="num"><input type="number" min="0" style="width:60px" data-mfield="stat" data-pid="${p.id}" data-leg="${leg-1}" data-k="assists" value="${s.assists}"></td>
          <td class="num"><input type="number" min="0" style="width:60px" data-mfield="stat" data-pid="${p.id}" data-leg="${leg-1}" data-k="saves" value="${s.saves}"></td>
          <td class="num"><input type="number" min="0" style="width:60px" data-mfield="stat" data-pid="${p.id}" data-leg="${leg-1}" data-k="tackles" value="${s.tackles}"></td>
          <td class="num"><input type="number" min="0" style="width:60px" data-mfield="stat" data-pid="${p.id}" data-leg="${leg-1}" data-k="fouls" value="${s.fouls || 0}"></td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  };

  html += `<div>${renderTeam(A.id)}<div style="height:12px"></div>${renderTeam(B.id)}</div>`;

  /* MVP/MOTM — use all players in draft (incl. transferred) */
  const allPlayersForAward = Object.keys(d.stats).map(pid => playerById(pid)).filter(Boolean);
  const optsMvp = allPlayersForAward.map(p => {
    const t = teamById(d.playerTeams[p.id] || p.teamId);
    return `<option value="${p.id}" ${d.mvpId === p.id ? 'selected':''}>${esc(p.name)} (${esc(t.name)})</option>`;
  }).join('');
  const optsMotm = allPlayersForAward.map(p => {
    const t = teamById(d.playerTeams[p.id] || p.teamId);
    return `<option value="${p.id}" ${d.motmId === p.id ? 'selected':''}>${esc(p.name)} (${esc(t.name)})</option>`;
  }).join('');

  html += `<div class="section-title" style="margin-top:16px">Awards</div>
  <div class="field-row">
    <div><label class="fl">🏅 MVP</label><select data-mfield="mvp"><option value="">— none —</option>${optsMvp}</select></div>
    <div><label class="fl">⭐ MOTM</label><select data-mfield="motm"><option value="">— none —</option>${optsMotm}</select></div>
  </div>`;
  return html;
}

document.addEventListener('click', async e => {
  if (e.target.classList && e.target.classList.contains('modal-back')){ closeModal(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if (act === 'goto'){ go(el.dataset.view); return; }
  if (act === 'modal:close'){ closeModal(); return; }

  if (act === 'login'){
    if (!firebaseReady){
      openModal('🔐 Admin (Local Mode)', `
        <div class="warnbox">Firebase is not configured. Enable local admin mode for this browser only.</div>
        <label class="fl">Admin passphrase</label>
        <input id="localPass" type="password" placeholder="Type: admin">
      `, `<button class="btn lime" data-act="login:local">Unlock</button><button class="btn" data-act="modal:close">Cancel</button>`);
      return;
    }
    openModal('🔐 Admin Login', `
      <label class="fl">Email</label><input id="loginEmail" type="email" placeholder="admin@myleague.com">
      <label class="fl">Password</label><input id="loginPass" type="password" placeholder="••••••••">
    `, `<button class="btn lime" data-act="login:do">Log in</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'login:local'){
    if (firebaseReady) return toast('❌ Local admin is off once the cloud is connected', 'err');
    if (($('#localPass').value || '') === 'admin'){
      app.isAdmin = true; app.user = { email: 'local-admin' };
      closeModal(); render(); toast('🔓 Local admin mode enabled', 'ok');
    } else toast('❌ Wrong passphrase', 'err');
    return;
  }
  if (act === 'login:do'){
    if (!firebaseReady || !app.auth) return toast('❌ Cloud login is not configured', 'err');
    const em = $('#loginEmail').value.trim(), pw = $('#loginPass').value;
    try {
      await app.auth.signInWithEmailAndPassword(em, pw);
      closeModal(); toast('✅ Logged in', 'ok');
    } catch(err){
      const map = {
        'auth/invalid-email': 'That email is not valid',
        'auth/user-not-found': 'No account with that email',
        'auth/wrong-password': 'Wrong password',
        'auth/invalid-credential': 'Wrong email or password',
        'auth/too-many-requests': 'Too many tries, wait a minute',
        'auth/unauthorized-domain': 'This domain is not allowed in Firebase Auth settings'
      };
      toast('❌ ' + (map[err.code] || err.message), 'err');
    }
    return;
  }
  if (act === 'logout'){
    if (firebaseReady && app.auth && app.user && app.user.email !== 'local-admin') await app.auth.signOut();
    app.isAdmin = false; app.user = null;
    go('registry'); toast('👋 Logged out');
    return;
  }

  if (act === 'team:add'){
    if (!app.isAdmin) return;
    openModal('➕ New Team', teamFormHTML(null),
      `<button class="btn lime" data-act="team:save">Save</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'team:save'){
    const name = $('#f_teamName').value.trim();
    if (!name) return toast('⚠️ Name required', 'err');
    const t = {
      id: uuid(), name,
      color: $('#f_teamColor').value,
      logo: ($('#f_teamLogo') ? $('#f_teamLogo').value.trim() : ''),
      value: Number($('#f_teamValue').value) || econ().teamStart,
      stats: {}
    };
    app.state.teams.push(t);
    await logAdmin('Created team "' + name + '"');
    await saveState(); closeModal(); render();
    toast('✅ Team created', 'ok');
    return;
  }
  if (act === 'team:edit'){
    if (!app.isAdmin) return;
    const t = teamById(id);
    openModal('✏️ Edit Team', teamFormHTML(t),
      `<button class="btn lime" data-act="team:update" data-id="${id}">Update</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'team:update'){

    if (!t) return;
    t.name = $('#f_teamName').value.trim() || t.name;
    t.color = $('#f_teamColor').value;
    t.logo = $('#f_teamLogo') ? $('#f_teamLogo').value.trim() : (t.logo || '');

    if (!app.isAdmin) return;
    const t = teamById(id);

    app.state.players = app.state.players.filter(p => p.teamId !== id);
    app.state.teams = app.state.teams.filter(x => x.id !== id);
    app.state.fixtures = app.state.fixtures.filter(f => f.teamAId !== id && f.teamBId !== id);
    app.state.matches = app.state.matches.filter(m => m.teamAId !== id && m.teamBId !== id);
    /* cancel any loans referencing the deleted team */
    app.state.players.forEach(p => {
      if (p.loanStatus && p.loanStatus.from === id) p.loanStatus = null;
    });
    await logAdmin('Deleted team "' + t.name + '"');
    await saveState();
    if (app.currentView === 'teamprofile'){ app._teamViewId = null; app.currentView = 'teams'; }
    render(); toast('🗑️ Team deleted', 'err');
    return;
  }

    return;
  }
  if (act === 'team:fundsave'){
    const t = app.state.teams.find(x => x.id === id);
    const amt = Number($('#f_funds').value) || 0;
    const before = t.value; t.value += amt;
    await logAdmin('Added funds to "' + t.name + '"', before, t.value);
    await saveState(); closeModal(); render();
    toast('💰 ' + money(amt) + ' applied', 'ok');
    return;
  }
  if (act === 'team:view'){
    if ($('#modalRoot').classList.contains('open')) closeModal();
    app._teamViewId = id;
    app.currentView = 'teamprofile';
    render(); window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  if (act === 'player:add'){
    if (!app.isAdmin) return;
    if (!app.state.teams.length) return toast('⚠️ Create a team first', 'err');

    openModal('➕ New Player', playerFormHTML({ name:'', teamId: preset || app.state.teams[0].id, startingValue: econ().playerStart }),
      `<button class="btn lime" data-act="player:save">Save</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'player:save'){
    const name = $('#f_playerName').value.trim();
    if (!name) return toast('⚠️ Name required', 'err');
    app.state.players.push({
      id: uuid(), name,
      teamId: $('#f_playerTeam').value,
      startingValue: Number($('#f_playerStart').value) || econ().playerStart,
      growthValue: 0, playerValue: 0, marketValue: 0,
      transferCount: 0, loanStatus: null, transferHistory: [], freeAgent: false
    });
    await logAdmin('Created player "' + name + '"');
    await saveState(); closeModal(); render();
    toast('✅ Player created', 'ok');
    return;
  }
  if (act === 'player:bulk'){
    if (!app.isAdmin) return;
    if (!app.state.teams.length) return toast('⚠️ Create a team first', 'err');
    const preset = el.dataset.team || '';
    openModal('📋 Bulk Add Players', `
      <div class="field-row">
        <div><label class="fl">Team</label><select id="b_team">${teamOptions(preset || app.state.teams[0].id)}</select></div>
        <div><label class="fl">Starting value</label><input type="number" id="b_start" value="${econ().playerStart}"></div>
      </div>
      <label class="fl">Names — one per line</label>
      <textarea id="b_names" rows="10" placeholder="Isagi&#10;Nagi&#10;Chigiri"></textarea>
      <div class="hint" style="margin-top:6px">Each line becomes one player.</div>
    `, `<button class="btn lime" data-act="player:bulk:save">➕ Add players</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'player:bulk:save'){
    if (!app.isAdmin) return;
    const tid = $('#b_team').value;
    const start = Number($('#b_start').value) || econ().playerStart;
    const names = parsePlayerLines($('#b_names').value);
    if (!names.length) return toast('⚠️ Type at least one name', 'err');
    names.forEach(name => {
      app.state.players.push({
        id: uuid(), name, teamId: tid, startingValue: start,

      });

  if (act === 'award:toggle'){
    if (!app.isAdmin) return;
    const key = el.dataset.key;
    const dis = app.state.settings.disabledAwards || [];
    if (dis.includes(key)) app.state.settings.disabledAwards = dis.filter(k => k !== key);
    else { dis.push(key); app.state.settings.disabledAwards = dis; }
    await logAdmin('Toggled award visibility: ' + key);
    await saveState(); render();
    return;
  }

  if (act === 'archive:create'){
    if (!app.isAdmin) return;
    if (!confirm('Archive the current season? Standings will be frozen and the season reset.')) return;
    await archiveSeason();
    return;
  }
  if (act === 'archive:view'){ app._archiveViewId = id; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if (act === 'archive:back'){ app._archiveViewId = null; render(); return; }
  if (act === 'archive:del'){
    if (!app.isAdmin) return;
    if (!confirm('Delete this archived season?')) return;
    app.state.archives = app.state.archives.filter(a => a.id !== id);
    app._archiveViewId = null;
    await logAdmin('Deleted archive');
    await saveState(); render();
    toast('🗑️ Archive deleted', 'err');
    return;
  }

  if (act === 'guide:add'){
    if (!app.isAdmin) return;
    openModal('➕ Guide Entry', `
      <label class="fl">Title</label><input id="g_title" placeholder="Rule title">
      <label class="fl">Content</label><textarea id="g_content" rows="7" placeholder="Write the rule..."></textarea>
    `, `<button class="btn lime" data-act="guide:save">Save</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'guide:save'){
    const title = $('#g_title').value.trim();
    const content = $('#g_content').value.trim();
    if (!title || !content) return toast('⚠️ Title and content required', 'err');
    app.state.guide.push({ id: uuid(), title, content, createdAt: Date.now(), updatedAt: Date.now(), by: (app.user && app.user.email) || 'admin' });
    await logAdmin('Added guide entry "' + title + '"');
    await saveState(); closeModal(); render();
    toast('✅ Guide entry added', 'ok');
    return;
  }
  if (act === 'guide:edit'){
    if (!app.isAdmin) return;
    const g = app.state.guide.find(x => x.id === id);
    openModal('✏️ Edit Guide Entry', `
      <label class="fl">Title</label><input id="g_title" value="${esc(g.title)}">
      <label class="fl">Content</label><textarea id="g_content" rows="7">${esc(g.content)}</textarea>
    `, `<button class="btn lime" data-act="guide:update" data-id="${id}">Update</button><button class="btn" data-act="modal:close">Cancel</button>`);
    return;
  }
  if (act === 'guide:update'){
    const g = app.state.guide.find(x => x.id === id);
    g.title = $('#g_title').value.trim() || g.title;
    g.content = $('#g_content').value.trim() || g.content;
    g.updatedAt = Date.now();
    g.by = (app.user && app.user.email) || 'admin';
    await logAdmin('Edited guide entry "' + g.title + '"');
    await saveState(); closeModal(); render();
    toast('✅ Guide updated', 'ok');
    return;
  }
  if (act === 'guide:del'){
    if (!app.isAdmin) return;
    if (!confirm('Delete this guide entry?')) return;
    app.state.guide = app.state.guide.filter(x => x.id !== id);
    await logAdmin('Deleted guide entry');
    await saveState(); render();
    toast('🗑️ Deleted', 'err');
    return;
  }

  if (act === 'logs:clear'){
    if (!app.isAdmin) return;
    if (!confirm('Clear all logs?')) return;
    app.state.logs = [];
    try { localStorage.removeItem(LS_LOGS); } catch(e){}
    await saveState(); render();
    toast('🧾 Logs cleared', 'err');
    return;
  }
});

function revertMatch(m){
  const E = econ();
  const agg = matchAggregate(m);
  const A = app.state.teams.find(t => t.id === m.teamAId);
  const B = app.state.teams.find(t => t.id === m.teamBId);
  if (!A || !B) return;
  if (agg.res === 'A'){
    if (E.enabled.win)  A.value -= E.win;
    if (E.enabled.loss) B.value -= E.loss;
  } else if (agg.res === 'B'){
    if (E.enabled.win)  B.value -= E.win;
    if (E.enabled.loss) A.value -= E.loss;
  } else {
    if (E.enabled.draw){ A.value -= E.draw; B.value -= E.draw; }
  }
}

async function saveMatch(){
  const d = app._draft;
  if (!d) return;
  const f = fixtureById(d.fixtureId);
  if (!f) return toast('❌ Fixture no longer exists', 'err');
  const isEdit = !!d.matchId;

  const ps = {};
  Object.keys(d.stats).forEach(pid => {
    const arr = d.stats[pid].slice(0, d.legs);
    if (arr.some(l => l.played)) ps[pid] = arr;
  });

  const m = {
    id: d.matchId || uuid(),
    teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id,
    timestamp: Date.now(),
    mvpId: d.mvpId || null, motmId: d.motmId || null,
    mvpSnapshot: d.mvpId ? (() => { const p = playerById(d.mvpId); return p ? { name:p.name, teamId:p.teamId } : null; })() : null,
    motmSnapshot: d.motmId ? (() => { const p = playerById(d.motmId); return p ? { name:p.name, teamId:p.teamId } : null; })() : null,
    playerStats: ps, playerTeams: {}
  };

  /* Preserve the snapshot team from draft (for edits, keeps transferred players on their original team) */
  Object.keys(ps).forEach(pid => {
    m.playerTeams[pid] = d.playerTeams[pid] || (playerById(pid)?.teamId) || null;
    if (!m.playerTeams[pid]) delete m.playerTeams[pid];
  });

  const isScored = val => val !== '' && val !== null && val !== undefined;
  for (let i = 1; i <= 4; i++){
    if (i <= d.legs && isScored(d.scores[i-1].a) && isScored(d.scores[i-1].b)){
      m['leg'+i+'ScoreA'] = Number(d.scores[i-1].a);
      m['leg'+i+'ScoreB'] = Number(d.scores[i-1].b);
    } else { m['leg'+i+'ScoreA'] = null; m['leg'+i+'ScoreB'] = null; }
  }

  if (isEdit){
    const old = matchById(d.matchId);
    if (old){
      revertMatch(old);
      app.state.matches = app.state.matches.filter(x => x.id !== old.id);
      m.timestamp = old.timestamp || Date.now();
      /* preserve old snapshots as last-resort fallback */
      if (old.playerTeams){
        Object.keys(ps).forEach(pid => {
          if (!m.playerTeams[pid] && old.playerTeams[pid]) m.playerTeams[pid] = old.playerTeams[pid];
        });
      }
    }
  }

  applyMatchToState(m, f);
  if (isEdit && f.tournamentId) rebuildTournamentKO(f.tournamentId);

  await logAdmin(isEdit ? 'Edited match result' : 'Recorded match result');
  await saveState(); closeModal(); render();
  toast(isEdit ? '✅ Match updated' : '✅ Match recorded', 'ok');
}

function openMatchDetail(m){
  const A = teamById(m.teamAId), B = teamById(m.teamBId);
  const agg = matchAggregate(m);
  const mvp = m.mvpId ? playerById(m.mvpId) : null;
  const motm = m.motmId ? playerById(m.motmId) : null;
  const ps = m.playerStats || {};

  let html = `<div class="row" style="justify-content:center;gap:14px;margin-bottom:10px">
    ${teamLink(A, 40)}
    <b style="font-size:26px;color:var(--cyan);text-shadow:0 0 18px rgba(0,240,255,.7)">${agg.a} - ${agg.b}</b>
    ${teamLink(B, 40)}
  </div>
  <div class="center muted small" style="margin-bottom:10px">
    ${new Date(m.timestamp||0).toLocaleString()} &nbsp;|&nbsp; ${agg.legs.length} leg${agg.legs.length > 1 ? 's' : ''}
  </div>
  <div class="row" style="justify-content:center;gap:8px;margin-bottom:6px">
    ${mvp ? `<span class="pill go">🏅 MVP: ${playerLink(mvp)}</span>` : (m.mvpSnapshot ? `<span class="pill go">🏅 MVP: <span class="muted">${esc(m.mvpSnapshot.name)} (deleted)</span></span>` : '')}
    ${motm ? `<span class="pill mg">⭐ MOTM: ${playerLink(motm)}</span>` : (m.motmSnapshot ? `<span class="pill mg">⭐ MOTM: <span class="muted">${esc(m.motmSnapshot.name)} (deleted)</span></span>` : '')}
  </div>`;

  const legTable = (tid, legIndex) => {
    const tm = teamById(tid);
    const rows = [];
    /* Use snapshot team so transferred players still show under the team they played for */
    Object.keys(ps).forEach(pid => {
      const p = playerById(pid);
      const snapTeam = teamForMatch(m, pid);
      if (snapTeam !== tid) return;
      const arr = ps[pid];
      const l = arr && arr[legIndex];
      if (!l || !l.played) return;
      if (p) rows.push({ p, l });
      else rows.push({ p: { id: pid, name: '(deleted player)' }, l, ghost: true });
    });
    if (!rows.length) return `<div class="empty" style="padding:14px">No ${esc(tm.name)} players tracked</div>`;

    const score = l => (+l.goals||0)*5 + (+l.assists||0)*3 + (+l.saves||0) + (+l.tackles||0)*0.5;
    rows.sort((x,y) => score(y.l) - score(x.l));
    const tot = rows.reduce((t,r) => ({
      g: t.g + (+r.l.goals||0), a: t.a + (+r.l.assists||0),
      s: t.s + (+r.l.saves||0), k: t.k + (+r.l.tackles||0), f: t.f + (+r.l.fouls||0)
    }), { g:0, a:0, s:0, k:0, f:0 });
    const foulMoney = tot.f * Math.abs(econ().foul || 0);

    return `<div class="tblwrap"><table style="min-width:460px">
      <thead><tr><th>${teamTag(tm, 20)}</th><th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th><th class="num">F</th><th class="num">Grade</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td>${r.ghost ? `<span class="muted">${esc(r.p.name)}</span>` : playerLink(r.p)}</td>
          <td class="num">${+r.l.goals||0}</td>
          <td class="num">${+r.l.assists||0}</td>
          <td class="num">${+r.l.saves||0}</td>
          <td class="num">${+r.l.tackles||0}</td>
          <td class="num" style="color:${(+r.l.fouls||0) > 0 ? 'var(--red)' : 'inherit'}">${+r.l.fouls||0}</td>
          <td class="num"><span class="rk rk-${legGrade(r.l)}">${legGrade(r.l)}</span></td>
        </tr>`).join('')}
        <tr class="leg-total">
          <td>Totals</td>
          <td class="num">${tot.g}</td><td class="num">${tot.a}</td><td class="num">${tot.s}</td><td class="num">${tot.k}</td><td class="num">${tot.f}</td><td></td>
        </tr>
      </tbody>
    </table></div>
    <div class="tiny" style="color:var(--red);margin-top:6px;text-align:right">
      🚫 ${tot.f} foul${tot.f === 1 ? '' : 's'} = -${money(foulMoney)} off player value
    </div>`;
  };

  agg.legs.forEach(l => {
    const i = l.n - 1;
    html += `<div class="leg-block">
      <div class="leg-head">
        <span class="pill cy">LEG ${l.n}</span>
        <b class="mono">${l.a} - ${l.b}</b>
        <span class="tiny muted">${l.a > l.b ? esc(A.name) + ' won the leg' : l.b > l.a ? esc(B.name) + ' won the leg' : 'Drawn leg'}</span>
      </div>
      ${legTable(A.id, i)}
      <div style="height:10px"></div>
      ${legTable(B.id, i)}
    </div>`;
  });

  openModal('📊 Match Details', html, `<button class="btn" data-act="modal:close">Close</button>`);
}

function openTransferMarket(){
  if (!app.state.players.length) return toast('⚠️ No players yet', 'err');
  const st = computePlayerStats();
  const activePlayers = app.state.players.filter(p => !p.freeAgent);
  const freeAgents = app.state.players.filter(p => p.freeAgent);

  if (!activePlayers.length && !freeAgents.length) return toast('⚠️ No players available', 'err');

  let html = '';
  if (activePlayers.length){
    html += `
      <div class="section-title" style="margin-top:0">💱 Transfer / Loan</div>
      <label class="fl">Player</label>
      <select id="m_player">
        ${activePlayers.map(p => `<option value="${p.id}">${esc(p.name)} — ${esc(teamById(p.teamId).name)} (${money(st[p.id]?.playerValue||0)})</option>`).join('')}
      </select>
      <label class="fl">Buyer team</label>
      <select id="m_buyer">${teamOptions()}</select>
      <label class="fl">Deal type</label>
      <select id="m_type">
        <option value="transfer">Full transfer (100% of value)</option>
        <option value="loan">Loan (${econ().loanPct}% for ${econ().loanLegs} legs)</option>
      </select>
      <div class="hint" style="margin-top:8px">Transfers move the full player value from buyer to seller. Loans cost ${econ().loanPct}% of value for ${econ().loanLegs} legs, then the player returns automatically.</div>
    `;
  } else {
    html += `<div class="muted small">No active players available for transfer.</div>`;
  }

  html += `<div class="divider"></div>
    <div class="section-title" style="margin-top:0">🟡 Sign Free Agent</div>`;

  if (freeAgents.length){
    html += `<div class="field-row">
      <div><label class="fl">Free agent</label>
        <select id="m_fa_player">
          <option value="">— select —</option>
          ${freeAgents.map(p => `<option value="${p.id}">${esc(p.name)}${p.teamId ? ' (last: ' + esc(teamById(p.teamId).name) + ')' : ''}</option>`).join('')}
        </select>
      </div>
      <div><label class="fl">Sign to team</label>
        <select id="m_fa_team">${teamOptions()}</select>
      </div>
    </div>
    <button class="btn lime" style="margin-top:8px" data-act="market:signfa">✍️ Sign free agent</button>`;
  } else {
    html += `<div class="muted small">No free agents available.</div>`;
  }

  openModal('💱 Transfer Market', html,
    `${activePlayers.length ? '<button class="btn lime" data-act="market:do">Execute Transfer/Loan</button>' : ''}
     <button class="btn" data-act="modal:close">Close</button>`);
}

function openAwardRanking(key){
  const { teamAwards, playerAwards } = buildAwards();
  const all = teamAwards.concat(playerAwards);
  const a = all.find(x => x.key === key);
  if (!a) return;

  const rows = (a.rows || []).slice(0, 400);
  const maxV = Math.max(...rows.map(r => Math.abs(r.value)), 1);
  const isPlayer = playerAwards.some(x => x.key === key);

  let html = `<div class="tiny muted" style="margin-bottom:12px">${esc(a.desc)}</div>`;
  if (!rows.length) html += `<div class="empty">No data yet</div>`;
  else {
    html += `<div class="tiny muted" style="margin-bottom:8px">${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}, zeros included</div>`;
    html += `<div class="tblwrap"><table>
      <thead><tr><th>#</th><th>Name</th><th class="num">Value</th><th style="width:130px">Chart</th></tr></thead>
      <tbody>${rows.map((r,i) => `<tr class="${i < 3 ? 'top' + (i + 1) : ''}">
        <td><span class="rk ${i===0?'rank1':i===1?'rank2':i===2?'rank3':'rk-D'}">${i+1}</span></td>
        <td>${r.p2Id ? `${playerLink(playerById(r.id), r.color)} & ${playerLink(playerById(r.p2Id), r.color)}`
          : (isPlayer
            ? (playerById(r.id) ? playerLink(playerById(r.id), r.color) : esc(r.label))
            : (teamById(r.id) && app.state.teams.some(t => t.id === r.id) ? teamLink(teamById(r.id), 20) : esc(r.label)))}
          ${r.sub ? `<div class="tiny muted">${esc(r.sub)}</div>` : ''}</td>
        <td class="num" style="color:var(--gold);font-weight:800">${r.fmt ? r.fmt(r.value) : num(r.value)}</td>
        <td><div class="bar" style="height:12px"><span style="width:${Math.max(2,(Math.abs(r.value)/maxV)*100)}%"></span></div></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }
  openModal(a.icon + ' ' + esc(a.title), html, `<button class="btn" data-act="modal:close">Close</button>`);
}

async function archiveSeason(){
  const st = computePlayerStats();
  const table = standingsSorted();
  const bd = ballonDor().slice(0, 5);

  const topPlayers = app.state.players.map(p => ({
    name: p.name, team: teamById(p.teamId).name,
    goals: st[p.id]?.goals || 0, assists: st[p.id]?.assists || 0,
    saves: st[p.id]?.saves || 0, tackles: st[p.id]?.tackles || 0,
    value: st[p.id]?.playerValue || 0
  })).sort((a,b) => (b.goals*5 + b.assists*3) - (a.goals*5 + a.assists*3)).slice(0, 25);

  const archive = {
    id: uuid(),
    leagueName: app.state.leagueName, seasonName: app.state.seasonName,
    archivedAt: Date.now(),
    champion: table[0] ? table[0].name : null,
    standings: table.map(r => ({ name: r.name, mp:r.mp, w:r.w, d:r.d, l:r.l, gf:r.gf, ga:r.ga, gd:r.gd, pts:r.pts, value:r.value })),
    topPlayers,
    ballonTop5: bd.map(r => ({ name: r.player.name, team: teamById(r.player.teamId).name, pts: Math.round(r.pts) })),
    goldenBoot: topPlayers[0] ? topPlayers[0].name : null,
    matchCount: app.state.matches.length, playerCount: app.state.players.length
  };

  app.state.archives.push(archive);

  const E = econ();
  app.state.matches = [];
  app.state.fixtures = [];
  app.state.tournaments = [];
  app.state.teams.forEach(t => t.value = E.teamStart);
  app.state.players.forEach(p => { p.startingValue = E.playerStart; p.loanStatus = null; p.transferHistory = []; });

  await logAdmin('Archived season "' + archive.seasonName + '"');
  await saveState(); render();
  toast('📦 Season archived & reset', 'ok');
}
